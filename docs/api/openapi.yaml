  /api/git/worktree/create:
    post:
      description: Creates a new git worktree at `path` from `branch` (or a new branch based on the current one).
      operationId: gitWorktreeCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitWorktreeCreateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitWorktreeCreateResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid JSON, a missing path or branch, an invalid path, or an invalid branch name.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "409":
