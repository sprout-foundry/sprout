<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Allow user pinch-zoom for accessibility. Lighthouse a11y flags
         maximum-scale=1/user-scalable=no as a WCAG violation.
         viewport-fit=cover (P4.5 terminal edge): extends the layout
         viewport INTO the notch/home-indicator zone so fixed-position
         chrome (the terminal portal) anchors to the PHYSICAL bottom.
         Without it, iOS confines the viewport to the safe area and the
         strip's bottom:0 lands above the home indicator — the page
         background shows as a persistent dark band under the terminal
         on physical devices (simulator renders it flush, so the bug was
         device-only). Surfaces that must avoid the notch use
         env(safe-area-inset-*) themselves. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14b8c8" />
    <meta name="description" content="AI-powered code editing and assistance tool with file browser and CodeMirror integration" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="sprout" />
    <meta name="application-name" content="sprout" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#14b8c8" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>Sprout Foundry</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- WebView viewport-unit insurance: some Android WebViews resolve
         vh/svh to 0 for height/max-height (observed S25/Android 16:
         body{height:100vh} → 0px), collapsing the app shell and any
         vh-clamped dialog to nothing. The inline style seeds html and
         body with a real pixel height from visualViewport before React
         mounts; CSS below layers percentage fallbacks on top. -->
    <script>
      (function () {
        var seed = function () {
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          document.documentElement.style.height = h + 'px';
          document.body.style.height = h + 'px';
        };
        seed();
        window.addEventListener('resize', seed);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', seed);
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
