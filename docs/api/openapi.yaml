  /api/file:
    get:
      description: Reads and returns the raw content of the file at the `path` query parameter, with a detected Content-Type. Serves a conditional 304 when the `If-Modified-Since` header matches the file's mtime. External paths (outside the workspace and app-config directory) require an unconsumed file-consent token.
      operationId: fileRead
      parameters:
        - description: The file to read, relative to the workspace root.
          in: query
          name: path
          required: true
          schema:
            type: string
        - description: A file-consent token for an external (non-workspace) path.
          in: query
          name: consent_token
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: OK
        "304":
          description: Not modified; the client's copy is current.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing path, an invalid path, or the path is a directory.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The external path requires an unconsumed file-consent token.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The file does not exist.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET or POST.
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTooLargeResponse'
          description: The file is too large to open in the editor.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The file could not be read.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Read a file's contents.
      tags:
        - files
    post:
      description: Writes `content` to the file at the `path` query parameter, creating parent directories as needed. When `baseMtime` or `baseHash` is supplied the write is conditional on the file still being at the revision the caller last read; a mismatch returns 409 with the current revision and writes nothing. External paths require an unconsumed file-consent token.
      operationId: fileWrite
      parameters:
        - description: The file to write, relative to the workspace root.
          in: query
          name: path
          required: true
          schema:
            type: string
        - description: A file-consent token for an external (non-workspace) path.
          in: query
          name: consent_token
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileWriteRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing path, an invalid path, or a malformed or oversized body.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The external path requires an unconsumed file-consent token.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET or POST.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteConflictResponse'
          description: The base-revision guard failed; nothing was written.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The file could not be written.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Write a file's contents.
      tags:
        - files
