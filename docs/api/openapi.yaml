      type: object
    ShellApprovalDecisionRequest:
      description: The request body for the /api/shell-approvals/ POST.
      properties:
        decisions:
          additionalProperties:
            type: boolean
          description: Maps each shell-part ID to an approved boolean. Required.
          type: object
        request_id:
          description: The approval request ID; falls back to the path ID.
          type: string
      required:
        - decisions
      type: object
    ShellApprovalDecisionResponse:
      description: The response from the /api/shell-approvals/ POST.
      properties:
        delivered:
          type: boolean
        ok:
          type: boolean
        request_id:
          type: string
      required:
        - ok
        - request_id
        - delivered
      type: object
    SteerAcceptedResponse:
      description: The 202 response from /api/query/steer when input was injected.
      properties:
        accepted:
          type: boolean
        mode:
          enum:
            - steer
          type: string
        query:
          description: Echo of the steer input.
          type: string
        subagent_id:
          description: Present when the input was routed to a subagent.
          type: string
        target:
          description: Which agent the input was delivered to.
          enum:
            - primary
            - subagent
          type: string
        timestamp:
          format: int64
          type: integer
      required:
        - accepted
        - mode
        - query
        - target
        - timestamp
      type: object
    SteerCommandResponse:
      description: The 200 response from /api/query/steer when a safe command was executed.
      properties:
        accepted:
          description: True when the command ran without an error.
          type: boolean
        command:
          description: The executed command's name.
          type: string
        error:
          description: The command's error, when it failed.
          type: string
        mode:
          enum:
            - steer
          type: string
        output:
          description: The command's captured output, when any.
          type: string
        target:
          enum:
            - primary
          type: string
      required:
        - accepted
        - mode
        - command
        - target
      type: object
    SteerRetractResponse:
      description: The response from /api/query/steer/retract.
      properties:
        message:
          description: The retracted text, or empty when nothing was pending.
          type: string
        success:
          description: False when there was nothing to retract.
          type: boolean
      required:
        - success
        - message
      type: object
    SubagentCancelResponse:
      description: The 200/202 response from /api/subagent/.
      properties:
        accepted:
          description: Present on the 202 cancelled path.
          type: boolean
        already_completed:
          description: True when the subagent was not running.
          type: boolean
        id:
          description: The subagent ID.
          type: string
        mode:
          description: Present on the 202 cancelled path.
          enum:
            - cancel
          type: string
        status:
          description: Present on the 200 already-completed path.
          enum:
            - ok
          type: string
        timestamp:
          format: int64
          type: integer
      required:
        - id
        - timestamp
      type: object
    WorktreeInfo:
      description: A single git worktree.
      properties:
        branch:
          description: The branch checked out in the worktree; empty when detached.
          type: string
        is_current:
          description: Whether this is the active workspace.
          type: boolean
        is_main:
          description: Whether this is the main (primary) worktree.
          type: boolean
        parent_branch:
          description: The main worktree's branch; omitted for the main worktree itself.
          type: string
        parent_path:
          description: The main worktree's path; omitted for the main worktree itself.
          type: string
        path:
          description: The worktree's filesystem path.
          type: string
      required:
        - path
        - branch
        - is_main
        - is_current
      type: object
info:
  description: HTTP API that Sprout's spaces call against a host. Versioned by info.version and checked by the conformance suite (docs/api). Path entries are added per family; see the tags below and docs/api/undocumented.txt for routes still being documented.
  title: Sprout backend contract
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/browse:
    get:
      description: Lists the files and directories inside a path, always skipping the .git directory. When `path` is omitted the workspace root is listed. Set `ignore=true` to also filter out entries matched by the workspace's gitignore rules.
      operationId: browse
      parameters:
        - description: The directory to list, relative to the workspace root; defaults to the root.
          in: query
          name: path
          required: false
          schema:
            type: string
        - description: Filter out entries matched by gitignore rules when "true".
          in: query
          name: ignore
          required: false
          schema:
            default: "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowseResponse'
          description: The directory listing.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The directory path is not valid.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The directory is outside the workspace, or the home-workspace gate was not consented.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The directory could not be read.
      summary: List a directory's contents.
      tags:
        - files
  /api/chat-session/:
    get:
      description: 'Prefix route: the sub-segment(s) after /api/chat-session/ are dynamic; the documented shape is /api/chat-session/{chatId}/worktree. The GET reads the chat''s worktree path.'
      operationId: chatSessionWorktreeGet
      parameters:
        - description: The dynamic sub-segment(s); the documented shape is {chatId}/worktree.
          in: path
          name: chatId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionWorktreeResponse'
          description: The chat's worktree path.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid route.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Only GET and POST are accepted.
      summary: Get a chat session's worktree path.
      tags:
        - conversation/query
    post:
      description: Sets (or clears) the worktree path for a chat session at /api/chat-session/{chatId}/worktree. See the GET operation for the dynamic sub-segment shape.
      operationId: chatSessionWorktreeSet
      parameters:
        - description: The dynamic sub-segment(s); the documented shape is {chatId}/worktree.
          in: path
          name: chatId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionWorktreeSetRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionWorktreeResponse'
          description: The worktree path was set.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid route, worktree path, or a failed workspace switch.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Only GET and POST are accepted.
      summary: Set a chat session's worktree path.
      tags:
        - conversation/query
  /api/chat-sessions:
    get:
      description: Lists the requesting client's chat sessions with metadata, including the active chat.
      operationId: chatSessionsList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionsListResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List the client's chat sessions.
      tags:
        - conversation/query
  /api/chat-sessions/breakpoints:
    post:
      description: Lists the turns a chat session can be forked at.
      operationId: chatSessionBreakpoints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatIdRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionBreakpointsResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The chat agent was not available.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List a chat session's forkable breakpoints.
      tags:
        - conversation/query
  /api/chat-sessions/compact:
    post:
      description: Compacts a chat session's conversation state to reclaim context.
      operationId: chatSessionsCompact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionIdRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionCompactResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Failed to sync the chat state.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Compact a chat session's state.
      tags:
        - conversation/query
  /api/chat-sessions/create:
    post:
      description: Creates a new chat session for the client. In shared mode this is rejected beyond the single shared chat.
      operationId: chatSessionsCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionCreateRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionCreateResponse'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Multi-chat is disabled in shared mode.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A session with this ID already exists.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Create a chat session.
      tags:
        - conversation/query
  /api/chat-sessions/create-in-worktree:
    post:
      description: Creates a git worktree off the current branch and a chat session bound to it.
      operationId: chatSessionsCreateInWorktree
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionCreateInWorktreeRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionCreateInWorktreeResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The worktree path or a session with this ID already exists.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An internal error occurred.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Create a chat session in a new git worktree.
      tags:
        - conversation/query
  /api/chat-sessions/delete:
    post:
      description: Deletes a chat session. The default session cannot be deleted.
      operationId: chatSessionsDelete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionDeleteRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDeleteResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing ID, or the session is the default, the active one, or has an active query.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Multi-chat is disabled in shared mode.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
