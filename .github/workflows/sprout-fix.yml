name: Sprout Fix

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sprout-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

  # fix runs are expensive (up to 60 min); serialize per issue/PR rather
  # than cancel mid-run — an in-progress fix shouldn't be killed by a
  # newer comment.

jobs:
  solve:
    # Trigger on /sprout-fix comment. Works on both issues and PRs:
    # - Issue: creates a branch, implements, opens a new PR
    # - PR: checks out the PR branch, addresses findings, pushes
    if: |
      contains(github.event.comment.body, '/sprout-fix') &&
      !contains(github.event.pull_request.labels.*.name, 'no-sprout') &&
      !contains(github.event.issue.labels.*.name, 'no-sprout')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.event.issue.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - uses: sprout-foundry/sprout-agent@v1
        with:
          mode: "fix"
          github-token: ${{ secrets.GITHUB_TOKEN }}

          primary-provider: "deepinfra"
          primary-model: "deepseek-ai/DeepSeek-V3.1"

          coder-provider: "deepinfra"
          coder-model: "deepseek-ai/DeepSeek-V3.1"

          deepinfra-api-key: ${{ secrets.DEEPINFRA_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}

          max-iterations: "500"
          timeout-minutes: "60"
          mcp: "github"
          debug: "false"
