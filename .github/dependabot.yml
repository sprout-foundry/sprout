# Dependabot configuration.
#
# The reference starters under pkg/starters/data/ are copied into every new
# builder project, so their dependencies ship to users. Each starter is its own
# npm project (they are not part of the root workspace), so each gets its own
# npm entry: weekly, with all updates grouped into a single PR per starter to
# keep the review queue small. The starters CI workflow audits each lockfile
# for high/critical advisories on every change and nightly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /pkg/starters/data/static-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      static-site:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /pkg/starters/data/web-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-app:
        patterns:
          - '*'
    ignore:
      # typescript-eslint (latest 8.x) peers typescript ">=4.8.4 <6.1.0", so
      # TypeScript 7 makes `npm ci` fail with ERESOLVE and the starter stops
      # installing for every new project. A grouped bump raised it to 7.0.2
      # and left Starter CI red from 2026-10-27 until the pin was restored.
      # Remove this once typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: npm
    directory: /pkg/starters/data/web-app-data
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-app-data:
        patterns:
          - '*'
    ignore:
      # Same constraint as web-app above: typescript-eslint peers
      # typescript "<6.1.0". Remove once typescript-eslint supports TS 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
