      type: object
      description: The response from /api/git/log.
      properties:
        message:
          type: string
        commits:
          type: array
          items:
            $ref: "#/components/schemas/GitCommit"
        offset:
          type: integer
          description: The offset the page was fetched from.
        limit:
          type: integer
          description: The page size used for the request.
        total:
          type: integer
          description: The total commit count; only populated when a full page was returned.
      required:
        - message
        - commits
        - offset
        - limit
        - total
