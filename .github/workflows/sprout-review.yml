name: Sprout PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sprout-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review-pr:
    # Run on PRs (non-draft), changes_requested reviews, review comments,
    # and issue comments with /sprout-review. Skip if labeled "no-sprout".
    if: |
      ((github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
       (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' &&
        github.event.review.author.login != 'github-actions[bot]') ||
       (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '/sprout-review')) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/sprout-review')))
      && !contains(github.event.pull_request.labels.*.name, 'no-sprout')
      && !contains(github.event.issue.labels.*.name, 'no-sprout')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve PR head ref (issue_comment events carry no head.ref)
        if: github.event_name == 'issue_comment'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" --jq '.pull_request.url' | sed 's|.*/pulls/||')
          head=$(gh api "repos/${{ github.repository }}/pulls/${pr}" --jq '.head.ref')
          echo "head=${head}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head || github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: sprout-foundry/sprout-agent@v1
        with:
          mode: "review"
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Primary reviewer — deepinfra is the repo's established agent
          # provider (see pricing-audit-agent.yml); secrets overlap.
          primary-provider: "deepinfra"
          primary-model: "deepseek-ai/DeepSeek-V4.1-Flash"

          # Subagent overrides (optional cost optimization)
          coder-provider: "deepinfra"
          coder-model: "deepseek-ai/DeepSeek-V4.1-Flash"

          deepinfra-api-key: ${{ secrets.DEEPINFRA_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}

          review-type: "comprehensive"
          comment-threshold: "medium"

          # Known false positive the reviewer must avoid (there is no
          # review-context input in sprout-agent@v1, so this lives here as
          # documentation): pkg/webui/security_headers.go reads
          # envutil.GetEnvSimple("FRAME_ANCESTORS"), and GetEnvSimple
          # prepends SPROUT_ (pkg/envutil/env.go: os.Getenv("SPROUT_"+suffix)).
          # The configured variable IS SPROUT_FRAME_ANCESTORS; docs that say
          # SPROUT_FRAME_ANCESTORS are correct — do not flag a mismatch.

          timeout-minutes: "30"
          debug: "false"

      # The sprout-agent action exits 0 even when it fails to produce a
      # review (see review.json "not created" runs), so the job would go
      # green with nothing posted. Check here — never fail this step, just
      # record whether a valid review.json exists; the retry and the final
      # gate key off it.
      - name: Check review.json was produced
        id: review
        env:
          REVIEW_JSON: /tmp/sprout-run-${{ github.run_id }}-1/review.json
        run: |
          if [ -f "$REVIEW_JSON" ] && jq -e '
            {summary: (.summary|type=="string"),
             approval_status: (.approval_status|IN("approve","request_changes","comment")),
             comments: (.comments|type=="array" and all(.[]; (.file|type=="string") and (.line|type=="number") and (.body|type=="string")))}
          ' "$REVIEW_JSON" > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::review.json missing or invalid ($REVIEW_JSON) — retry will run"
          fi

      # Sprout installs from GitHub releases on every run; a single
      # transient 503 from the release CDN fails the whole job. Retry
      # once; skipped when the first attempt succeeds.
      - name: Retry review (transient install failures)
        if: failure() || steps.review.outputs.ok != 'true'
        uses: sprout-foundry/sprout-agent@v1
        with:
          mode: "review"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          primary-provider: "deepinfra"
          primary-model: "deepseek-ai/DeepSeek-V4.1-Flash"
          coder-provider: "deepinfra"
          coder-model: "deepseek-ai/DeepSeek-V4.1-Flash"
          deepinfra-api-key: ${{ secrets.DEEPINFRA_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          review-type: "comprehensive"
          comment-threshold: "medium"
          timeout-minutes: "30"
          debug: "false"

      # Final gate: whatever happened, the job is green only if a valid
      # review.json exists at the end. This is the step that decides the
      # job conclusion, so the review-pr check goes red when the reviewer
      # cannot produce a review — instead of reporting success with
      # nothing posted.
      - name: Require review.json
        if: always()
        run: |
          REVIEW_JSON=$(ls /tmp/sprout-run-${{ github.run_id }}-*/review.json 2>/dev/null | head -1 || true)
          test -n "$REVIEW_JSON" && test -f "$REVIEW_JSON" || { echo "::error::review.json was not produced by the retry either (no /tmp/sprout-run-${{ github.run_id }}-*/review.json found)"; exit 1; }
          jq -e '
            {summary: (.summary|type=="string"),
             approval_status: (.approval_status|IN("approve","request_changes","comment")),
             comments: (.comments|type=="array" and all(.[]; (.file|type=="string") and (.line|type=="number") and (.body|type=="string")))}
          ' "$REVIEW_JSON" > /dev/null || { echo "::error::review.json failed validation"; exit 1; }
