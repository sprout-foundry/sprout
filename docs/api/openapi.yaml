  /api/git/worktree/remove:
    post:
      description: Removes the git worktree at `path`.
      operationId: gitWorktreeRemove
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitWorktreePathRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitWorktreeRemoveResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid JSON, a missing or invalid path, or the path is the current worktree.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The worktree could not be removed.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Remove an existing worktree.
