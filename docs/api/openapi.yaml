      type: object
      description: The response from /api/git/branches.
      properties:
        message:
          type: string
          description: success when the workspace is a git repository, or not_git_repo otherwise.
        current:
          type: string
          description: The current branch; empty when detached or not a git repository.
        branches:
          type: array
          items:
            type: string
          description: The combined local and remote branch names, sorted with the current branch first.
        local_branches:
          type: array
          items:
            type: string
          description: The local branch names.
        remote_branches:
          type: array
          items:
            type: string
          description: The remote branch names, excluding HEAD symrefs.
      required:
        - message
        - current
        - branches
        - local_branches
        - remote_branches
