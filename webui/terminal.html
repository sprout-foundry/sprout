<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Sprout Terminal</title>
    <!--
      E-M3 component shell (D5 strategy): xterm.js + the WASM POSIX shell
      ONLY — no webui app bundle, no React. Mirrors the webui's
      TerminalPane WASM path (useWasmTerminalInput → wasmShell
      executeCommand) without the React/Pty machinery.
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d1117;
        overflow: hidden;
      }
      #terminal {
        height: 100%;
        padding: 6px 4px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script type="module" src="/src/components/standalone/terminalMain.ts"></script>
  </body>
</html>
