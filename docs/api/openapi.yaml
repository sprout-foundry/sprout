    post:
      description: Mints a short-lived consent token that authorizes a read or write of a file outside the workspace and the app-config directory. Paths that are already within the workspace (or the app-config directory) need no consent and are rejected with 400.
      operationId: fileConsent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileConsentRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileConsentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Malformed body, an invalid operation or path, or a path that needs no external consent.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The consent token could not be created.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Issue a file-consent token for an external path.
      tags:
        - files
  /api/files:
    get:
      description: Lists the entries of a directory, computing per-entry git status (modified, untracked, ignored) unless `git_status=false` is set for a faster, status-free listing. Defaults to the workspace root when `path` (or `dir`) is omitted.
      operationId: filesList
      parameters:
        - description: The directory to list, relative to the workspace root; defaults to the root.
          in: query
          name: path
          required: false
          schema:
            type: string
        - description: An alias for `path`.
          in: query
          name: dir
          required: false
          schema:
            type: string
        - description: Set to "false" to skip git-status computation.
          in: query
          name: git_status
          required: false
          schema:
            default: "true"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesListResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The directory path is not valid.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The directory is outside the workspace, or the home-workspace gate was not consented.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The directory could not be read.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List a directory with git status.
      tags:
        - files
  /api/files/prettier-config:
    get:
      description: Merges the Prettier configuration found in the workspace (the .prettierrc family of files and the `prettier` key in package.json) into a single object, with later sources overriding earlier ones. Only the formats the Go backend can parse are read; JS and TOML config files are intentionally skipped.
      operationId: prettierConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrettierConfig'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No workspace is configured.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Discover the workspace's Prettier configuration.
      tags:
        - files
