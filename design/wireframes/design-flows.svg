<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <!-- design-flows: Design mode — flow canvas with wireframe nodes + design rail. Source: webui/src DesignSurface / DesignRail / FlowsCanvas structure.
       Palette tokens: {color.dark.bg.primary} {color.dark.bg.secondary} {color.dark.bg.tertiary} {color.dark.bg.elevated} {color.dark.border.subtle} {color.dark.border.default} {color.dark.text.primary} {color.dark.text.secondary} {color.dark.text.muted} {color.dark.brand.active-cyan} {radius.md} {sizing.sidebar.width} -->
  <style>
    .bg { fill: #282c34; }
    .panel { fill: #21252b; }
    .tertiary { fill: #2c313a; }
    .elev { fill: #303742; }
    .none { fill: none; }
    .b1 { fill: none; stroke: rgba(171, 178, 191, 0.14); }
    .b2 { fill: none; stroke: rgba(171, 178, 191, 0.22); }
    .t1 { fill: #abb2bf; font: 14px sans-serif; }
    .t2 { fill: #9aa3b2; font: 13px sans-serif; }
    .tm { fill: #5c6370; font: 12px sans-serif; }
    .cy { fill: #22d3ee; font: 14px sans-serif; }
    .cyb { fill: #22d3ee; }
    .edge { fill: none; stroke: rgba(171, 178, 191, 0.34); }
    .cyline { fill: none; stroke: #22d3ee; }
  </style>

  <rect x="0" y="0" width="1440" height="900" class="bg"/>

  <!-- sidebar with design mode active -->
  <rect x="0" y="0" width="288" height="900" class="panel"/>
  <line x1="288" y1="0" x2="288" y2="900" class="b1" stroke-width="1"/>
  <circle cx="22" cy="17" r="8" class="cyb"/>
  <text x="36" y="22" class="t2">sprout</text>
  <rect id="mode-switcher" x="96" y="4" width="84" height="27" rx="6" class="elev"/>
  <text x="108" y="22" class="cy">Design</text>
  <text x="152" y="22" class="tm">&#9662;</text>

  <!-- rail tabs: flows active -->
  <text x="56" y="62" class="tm">DESIGN RAIL</text>
  <rect id="rail-flows" x="48" y="78" width="232" height="30" rx="6" class="none"/>
  <rect x="48" y="78" width="232" height="30" rx="6" class="elev" opacity="0.6"/>
  <line x1="48" y1="108" x2="280" y2="108" class="cyline" stroke-width="2"/>
  <text x="64" y="98" class="t1">Flows</text>
  <rect id="rail-screens" x="48" y="116" width="232" height="30" rx="6" class="none" data-nav="design-screens"/>
  <text x="64" y="136" class="t2">Screens</text>
  <rect id="rail-tokens" x="48" y="154" width="232" height="30" rx="6" class="none"/>
  <text x="64" y="174" class="t2">Tokens</text>
  <!-- flows list -->
  <text id="flow-1" x="60" y="216" class="t1" data-nav="design-flows">navigation.mmd</text>
  <text id="flow-2" x="60" y="240" class="t2" data-nav="design-flows">design-mode.mmd</text>
  <text id="flow-3" x="60" y="264" class="t2" data-nav="design-flows">agent-turn.mmd</text>
  <line x1="48" y1="284" x2="280" y2="284" class="b1" stroke-width="1"/>
  <text x="56" y="308" class="tm">7 wireframes &#183; 3 flows</text>

  <!-- header bar -->
  <rect x="288" y="0" width="1152" height="35" class="panel"/>
  <line x1="288" y1="35" x2="1440" y2="35" class="b1" stroke-width="1"/>
  <text x="304" y="22" class="t2">design/ &#183; flows &#183; navigation</text>
  <text x="1180" y="22" class="tm">&#8984;Z fit</text>

  <!-- canvas: flow nodes = wireframe frames -->
  <!-- node: app-shell (source of most edges) -->
  <rect id="node-app-shell" x="620" y="120" width="200" height="90" rx="6" class="none"/>
  <rect x="620" y="120" width="200" height="90" rx="6" class="elev"/>
  <line x1="620" y1="120" x2="820" y2="210" class="b2" stroke-width="1.5"/>
  <text x="636" y="146" class="t1">app-shell</text>
  <text x="636" y="166" class="tm">1440x900 &#183; draft</text>
  <rect x="636" y="178" width="168" height="22" rx="3" class="tertiary"/>
  <text x="648" y="193" class="tm">sidebar + chat + strip</text>
  <!-- edges out of app-shell -->
  <line x1="720" y1="210" x2="480" y2="330" class="edge" stroke-width="1.5"/>
  <line x1="780" y1="210" x2="900" y2="330" class="edge" stroke-width="1.5"/>
  <line x1="820" y1="170" x2="1050" y2="170" class="edge" stroke-width="1.5"/>
  <line x1="620" y1="170" x2="390" y2="170" class="edge" stroke-width="1.5"/>
  <line x1="720" y1="210" x2="720" y2="470" class="edge" stroke-width="1.5"/>
  <text x="500" y="270" class="tm">open git section</text>
  <text x="800" y="270" class="tm">open file</text>
  <text x="860" y="160" class="tm">&#8984;K</text>
  <text x="396" y="160" class="tm">start chat turn</text>
  <text x="736" y="350" class="tm">switch mode</text>
  <!-- node: git-panel -->
  <rect id="node-git-panel" x="380" y="330" width="180" height="80" rx="6" class="none"/>
  <rect x="380" y="330" width="180" height="80" rx="6" class="elev"/>
  <line x1="380" y1="330" x2="560" y2="410" class="b2" stroke-width="1.5"/>
  <text x="396" y="356" class="t2">git-panel</text>
  <text x="396" y="376" class="tm">draft</text>
  <text x="396" y="396" class="tm">status / stage / commit</text>
  <!-- node: editor -->
  <rect id="node-editor" x="820" y="330" width="180" height="80" rx="6" class="none"/>
  <rect x="820" y="330" width="180" height="80" rx="6" class="elev"/>
  <line x1="820" y1="330" x2="1000" y2="410" class="b2" stroke-width="1.5"/>
  <text x="836" y="356" class="t2">editor</text>
  <text x="836" y="376" class="tm">draft</text>
  <text x="836" y="396" class="tm">tabs + code + diff</text>
  <!-- node: command-palette -->
  <rect id="node-command-palette" x="1050" y="130" width="180" height="80" rx="6" class="none"/>
  <rect x="1050" y="130" width="180" height="80" rx="6" class="elev"/>
  <line x1="1050" y1="130" x2="1230" y2="210" class="b2" stroke-width="1.5"/>
  <text x="1066" y="156" class="t2">command-palette</text>
  <text x="1066" y="176" class="tm">draft</text>
  <text x="1066" y="196" class="tm">files / symbols / actions</text>
  <!-- node: settings -->
  <rect id="node-settings" x="300" y="130" width="180" height="80" rx="6" class="none"/>
  <rect x="300" y="130" width="180" height="80" rx="6" class="elev"/>
  <line x1="300" y1="130" x2="480" y2="210" class="b2" stroke-width="1.5"/>
  <text x="316" y="156" class="t2">settings</text>
  <text x="316" y="176" class="tm">draft</text>
  <text x="316" y="196" class="tm">providers / models / theme</text>
  <!-- node: design-screens (self-mode) -->
  <rect id="node-design-screens" x="620" y="470" width="200" height="90" rx="6" class="none"/>
  <rect x="620" y="470" width="200" height="90" rx="6" class="elev"/>
  <line x1="620" y1="470" x2="820" y2="560" class="b2" stroke-width="1.5"/>
  <text x="636" y="496" class="cy">design-screens</text>
  <text x="636" y="516" class="tm">draft</text>
  <rect x="636" y="528" width="168" height="22" rx="3" class="tertiary"/>
  <text x="648" y="543" class="tm">browser + detail pane</text>
  <!-- self node marker -->
  <text x="620" y="590" class="tm">&#9679; this screen (design-flows)</text>

  <!-- zoom controls -->
  <rect id="zoom" x="1330" y="820" width="90" height="60" rx="6" class="panel"/>
  <line x1="1330" y1="820" x2="1420" y2="880" class="b2" stroke-width="1"/>
  <text x="1348" y="846" class="t1">+</text>
  <text x="1348" y="870" class="t1">&#8722;</text>
  <text x="1392" y="852" class="tm">fit</text>
</svg>
