      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Add an MCP server.
      tags:
        - settings
    put:
      description: Updates the MCP server at /api/settings/mcp/servers/{name} with the supplied body.
      operationId: settingsMcpServersPut
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Update an MCP server.
      tags:
        - settings
  /api/settings/providers:
    get:
      description: Returns the configured custom providers as a map keyed by name, with sensitive fields sanitized.
      operationId: settingsProvidersList
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List custom providers.
      tags:
        - settings
    post:
      description: Creates a new custom provider. The provider file is written before the in-memory map is mutated so a failure leaves prior state untouched; a duplicate name returns 409.
      operationId: settingsProvidersCreate
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Create a custom provider.
      tags:
        - settings
  /api/settings/providers/:
    delete:
      description: Removes the custom provider at /api/settings/providers/{name} and its backing file. A missing provider returns 404.
      operationId: settingsProvidersDelete
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Delete a custom provider.
      tags:
        - settings
    put:
      description: Updates the custom provider at /api/settings/providers/{name}; the body name is overridden by the URL segment. A missing provider returns 404.
      operationId: settingsProvidersUpdate
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Update a custom provider.
      tags:
        - settings
  /api/settings/skills:
    get:
      description: Returns the skills configuration section.
      operationId: settingsSkillsGet
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Read the skills settings.
      tags:
        - settings
    put:
      description: Replaces the skills configuration section with the supplied body.
      operationId: settingsSkillsPut
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Update the skills settings.
      tags:
        - settings
  /api/settings/subagent-types:
    get:
      description: Returns the configured subagent types, the disabled personas, and the available providers/models. Personas are catalog-fixed, so only GET is supported.
      operationId: settingsSubagentTypes
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List the subagent types.
      tags:
        - settings
  /api/settings/subagent-types/:
    get:
      description: Subtree form of the subagent-types listing; the same read handler serves both the exact and trailing-slash patterns.
      operationId: settingsSubagentTypesSubtree
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List the subagent types (subtree).
      tags:
        - settings
  /api/shell-approvals/:
    post:
      description: Submits per-part accept/reject choices for a pending shell approval at the /api/shell-approvals/{id}/decision shape, unblocking the agent's shell-approval broker.
      operationId: shellApprovalDecision
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Submit a per-part shell approval decision.
      tags:
        - conversation/query
  /api/skills:
    get:
      description: Lists the skills available to the agent, with their source and enabled state.
      operationId: skillsList
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List installed skills.
      tags:
        - settings
  /api/skills/:
    get:
      description: 'Subtree form of the skills surface: /api/skills/ (list) and /api/skills/registry (the browsable registry).'
      operationId: skillsListSubtree
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List skills or the registry (subtree).
      tags:
        - settings
    post:
      description: Runs a skill lifecycle action at /api/skills/install, /api/skills/update, or /api/skills/remove.
      operationId: skillsAction
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Install, update, or remove a skill (subtree).
      tags:
        - settings
  /api/starters:
    get:
      description: Lists the embedded starter projects the new-project flow can instantiate, with their metadata.
      operationId: startersList
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List the starter project catalogue.
      tags:
        - starters
  /api/starters/instantiate:
    post:
      description: Populates a fresh project directory from the starter at `starter` in the body so the new-project flow can open it.
      operationId: startersInstantiate
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Instantiate a starter project.
      tags:
        - starters
  /api/stats:
    get:
      description: Reports server and per-client statistics, including provider, model, and token usage.
      operationId: get-stats
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Server statistics
      tags:
        - diagnostics
  /api/subagent/:
    post:
      description: 'Cancels one running subagent in the active chat at the /api/subagent/{id}/cancel shape. Idempotent: a non-running ID returns a 200 already_completed payload.'
      operationId: subagentCancel
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Cancel a running subagent.
      tags:
        - conversation/query
  /api/support-bundle:
    get:
      description: Collects the logs, configuration, and state snapshot needed to diagnose an issue on this client.
      operationId: supportBundle
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Generate a support-bundle snapshot.
      tags:
        - diagnostics
  /api/sync:
    get:
      description: 'Returns the workspace git reconciliation report (the same JSON `sprout sync` prints). GET/HEAD are status-only and never pull: the pull query parameter is deliberately ignored on read requests because they pass through the auth middleware unauthenticated.'
      operationId: syncStatus
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Report the workspace git reconciliation status.
      tags:
        - sync/txn
    post:
      description: Returns the workspace git reconciliation report and, by default, pulls (POST is the only method that may pull). `pull=0` degrades the call to status-only. The pull runs detached from request cancellation so a client hang-up cannot strand git.
      operationId: syncPull
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Pull and reconcile the workspace git state.
      tags:
        - sync/txn
  /api/sync/batch:
    post:
      description: Applies a batch of file-sync operations (the body's `ops`) to the workspace and returns the per-operation results.
      operationId: syncBatch
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Apply a batch of file-sync operations.
      tags:
        - sync/txn
  /api/sync/op:
    post:
      description: Applies a single file-sync operation (the body's `op`) to the workspace, updating the agent's tracked file metadata. Conflicts are reported with 409.
      operationId: syncOp
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Apply a single file-sync operation.
      tags:
        - sync/txn
  /api/sync/status:
    get:
      description: Returns the current file-sync state (the agent's tracked files) for the client's workspace.
      operationId: syncAgentStatus
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Report the agent's file-sync state.
      tags:
        - sync/txn
  /api/terminal/agent-sessions:
    get:
      description: Lists the client's agent-driven terminal sessions (background and hidden) with their state.
      operationId: agentSessionsList
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List the agent terminal sessions.
      tags:
        - terminal
  /api/terminal/agent-sessions/:
    get:
      description: 'Performs an action on one agent terminal session at the /api/terminal/agent-sessions/{id}/{action} shape: GET {id}/output returns accumulated output; POST {id}/attach promotes a hidden session to visible; POST {id}/kill terminates it.'
      operationId: agentSessionAction
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Act on an agent terminal session.
      tags:
        - terminal
    post:
      description: 'Performs a mutating action on one agent terminal session at the /api/terminal/agent-sessions/{id}/{action} shape: POST {id}/attach promotes a hidden session to visible; POST {id}/kill terminates it.'
      operationId: agentSessionActionPost
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Attach or kill an agent terminal session.
      tags:
        - terminal
  /api/terminal/history:
    get:
      description: Returns the command history for the `session_id` terminal session (an empty list when no session ID is given).
      operationId: terminalHistoryGet
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Read a terminal session's command history.
      tags:
        - terminal
    post:
      description: Records `command` in the `session_id` terminal session's history (stored even without an active session).
      operationId: terminalHistoryPost
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Record a command in a terminal session's history.
      tags:
        - terminal
  /api/terminal/sessions:
    get:
      description: Lists the client's active terminal sessions with their ID, active flag, last-used time, and size presence.
      operationId: terminalSessions
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List the active terminal sessions.
      tags:
        - terminal
  /api/terminal/shells:
    get:
      description: Lists the shells available for terminal sessions on this host.
      operationId: terminalShells
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List the available terminal shells.
      tags:
        - terminal
  /api/txn/pull:
    post:
      description: Builds the container→browser delta manifest for the request's workspace (a read of the tree that is detached from request cancellation so a client hang-up cannot tear the encoding down).
      operationId: txnPull
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Build the pull delta manifest.
      tags:
        - sync/txn
  /api/txn/push:
    post:
      description: Applies the browser→container delta manifest in the body to the request's workspace. A partial apply is still reported (200) with the per-file outcomes so the platform can reason about it.
      operationId: txnPush
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Apply a push delta manifest to the workspace.
      tags:
        - sync/txn
  /api/txn/run:
    post:
      description: Executes the command in the body in the request's workspace, in its own process group and bounded by its own timeout so a client hang-up cannot strand it.
      operationId: txnRun
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Execute a command in the workspace.
      tags:
        - sync/txn
  /api/txn/status:
    get:
      description: 'Returns the read-only working-tree preflight for the request''s workspace. This is the read-only half of the transaction surface: it is reachable unauthenticated (GET/HEAD pass through the auth middleware) and never mutates.'
      operationId: txnStatus
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Report the workspace's working-tree preflight.
      tags:
        - sync/txn
  /api/upload/image:
    post:
      description: Accepts an image either as a raw body or as a multipart form field named `image`. The image format is validated by magic bytes and the file is saved into the workspace; the response returns the absolute path and filename so the client can reference it in a message.
      operationId: uploadImage
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Upload an image for use in a chat.
      tags:
        - files
  /api/workspace:
    get:
      description: Reports the requesting client's active workspace root, whether it is a recognized project directory, and recent-workspace metadata.
      operationId: workspaceGet
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Report the client's active workspace.
      tags:
        - workspace/instances
    post:
      description: Sets the requesting client's active workspace root to the `path` in the body. The path must resolve within the daemon root.
      operationId: workspaceSet
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Set the client's active workspace.
      tags:
        - workspace/instances
  /api/workspace/browse:
    get:
      description: Lists the directories under the daemon root (the parent of the active workspace) so the client can pick a new workspace. Defaults to the daemon root when `path` is omitted.
      operationId: workspaceBrowse
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Browse directories under the daemon root.
      tags:
        - workspace/instances
  /api/workspace/projects:
    get:
      description: Lists the recent projects known to the client (the workspace picker) with their last-used ordering.
      operationId: workspaceProjects
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List known projects.
      tags:
        - workspace/instances
  /api/workspace/symbols:
    get:
      description: Returns the workspace's indexed symbols, optionally filtered by `query`. Falls back to building the index on a cache miss.
      operationId: workspaceSymbols
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List workspace symbols.
      tags:
        - workspace/instances
  /api/workspace/sync:
    post:
      description: Applies the pending file-sync operations for the workspace (the SP-046 workspace-sync surface).
      operationId: workspaceSync
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Synchronize the workspace tree.
      tags:
        - workspace/instances
  /api/workspace/takeover:
    post:
      description: Marks the requesting client as the active owner of the workspace, superseding the previous owner.
      operationId: workspaceTakeover
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Take over a workspace from another device.
      tags:
        - workspace/instances
  /api/ws-metrics:
    get:
      description: Reports the live WebSocket connection and message metrics for the server.
      operationId: wsMetrics
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Report WebSocket metrics.
      tags:
        - misc/static
tags:
  - description: Query lifecycle, steering, command execution, and completions.
    name: conversation/query
  - description: File browsing, reads/writes, create/delete/rename, and edits.
    name: files
  - description: Git status, history, diffs, commits, branches, and worktrees.
    name: git
  - description: Settings, providers, onboarding, hotkeys, skills, and config.
    name: settings
  - description: Terminal, agent-session, and language-server (LSP) surfaces.
    name: terminal
  - description: Workspace metadata and remote instance/SSH management.
    name: workspace/instances
  - description: File sync operations and container-side git transactions.
    name: sync/txn
  - description: Chat sessions and worktree session mappings.
    name: sessions
  - description: Search and search-and-replace across files.
    name: search
  - description: Diagnostics, semantic analysis, stats, and support bundles.
    name: diagnostics
  - description: Design-tree status and signals.
    name: design
  - description: Starter project catalogue and instantiation.
    name: starters
  - description: Bootstrap, static assets, and other non-family routes.
    name: misc/static
