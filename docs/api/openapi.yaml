        message_count:
          type: integer
        messages:
          description: The restored conversation messages, in display order.
          items:
            properties:
              content:
                type: string
              reasoning_content:
                description: Present when the message carried reasoning.
                type: string
              role:
                type: string
              tool_calls:
                description: Present when the message carried tool calls.
                items:
                  type: object
                type: array
            type: object
          type: array
        name:
