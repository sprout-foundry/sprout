# Sprout backend contract (OpenAPI 3.1) — hand-written seed.
#
# This file is the hand-written half of docs/api/openapi.yaml, which is
# generated by cmd/genapi by merging this seed with the Huma-generated
# document for the registered operations. Every JSON route is a Huma
# operation (registered in pkg/webui), so Huma supplies all of the
# `paths:` and `components:` sections; this seed contributes only the
# non-generated metadata the merge needs:
#
#   - `openapi:` / `info:` — the contract version is `info.version`,
#     reported by /api/bootstrap and compared by clients to detect
#     incompatible major-version drift. Bump it deliberately.
#   - `tags:` — one tag per family, named to match the grouping in
#     docs/api/endpoints.md.
#
# Routes that are not Huma JSON operations (WebSocket, streaming, static,
# and deliberately-internal surfaces) are tracked in
# docs/api/undocumented.txt, and a Go test in pkg/webui keeps the two in
# lockstep: a route is removed from the allowlist in the same change that
# registers it as a Huma operation.

openapi: 3.1.0
info:
  title: Sprout backend contract
  description: >-
    HTTP API that Sprout's spaces call against a host. Versioned by
    info.version and checked by the conformance suite (docs/api). Every
    JSON route is a Huma operation; the tags below name the families, and
    docs/api/undocumented.txt lists the routes that are not JSON operations.
  version: 1.0.0
tags:
  - name: conversation/query
    description: Query lifecycle, steering, command execution, and completions.
  - name: files
    description: File browsing, reads/writes, create/delete/rename, and edits.
  - name: git
    description: Git status, history, diffs, commits, branches, and worktrees.
  - name: settings
    description: Settings, providers, onboarding, hotkeys, skills, and config.
  - name: terminal
    description: Terminal, agent-session, and language-server (LSP) surfaces.
  - name: workspace/instances
    description: Workspace metadata and remote instance/SSH management.
  - name: sync/txn
    description: File sync operations and container-side git transactions.
  - name: sessions
    description: Chat sessions and worktree session mappings.
  - name: search
    description: Search and search-and-replace across files.
  - name: diagnostics
    description: Diagnostics, semantic analysis, stats, and support bundles.
  - name: design
    description: Design-tree status and signals.
  - name: starters
    description: Starter project catalogue and instantiation.
  - name: misc/static
    description: Bootstrap, static assets, and other non-family routes.
