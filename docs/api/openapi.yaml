    post:
      description: For each path in `files` (mapped to its last-known mtime in unix seconds), reports the files whose on-disk mtime or size has since changed, or that are now inaccessible. Also registers each existing file with the file watcher so changes can be pushed in real time.
      operationId: fileCheckModified
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileCheckModifiedRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileCheckModifiedResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request body is not valid JSON.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Report files that changed on disk.
      tags:
        - files
