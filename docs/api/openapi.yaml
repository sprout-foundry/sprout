      properties:
        id:
          type: string
        languages:
          type: array
          items:
            type: string
        binary:
          type: string
          description: The binary name or path expected on PATH.
        available:
          type: boolean
          description: Whether the binary was resolved on PATH.
        binaryPath:
          type: string
          description: The resolved binary path; present when available.
        installHint:
          type: string
          description: How to install the missing binary; present when applicable.
      required:
        - id
        - languages
        - binary
        - available
    LSPStatusResponse:
      type: object
      description: The response from /api/lsp/status.
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/LSPServerInfo"
        active:
          type: integer
          description: The number of currently active LSP sessions.
        workspace:
          type: string
          description: The workspace root.
      required:
        - servers
        - active
        - workspace
    GitFile:
      type: object
      description: A single file entry with its git status character.
      properties:
        path:
          type: string
          description: The file path, relative to the repository root.
        status:
          type: string
          description: The git name-status character (for example M, A, D, R, or ? for untracked).
        staged:
          type: boolean
          description: Whether the file is staged; omitted when the entry is not staged.
      required:
        - path
        - status
    GitStatus:
      type: object
      description: The structured git status for a repository.
      properties:
        branch:
          type: string
          description: The current branch; empty when detached.
        ahead:
          type: integer
          description: How many commits ahead of the upstream branch.
        behind:
          type: integer
          description: How many commits behind the upstream branch.
        staged:
          type: array
          items:
            $ref: "#/components/schemas/GitFile"
          description: Files staged for commit.
        modified:
          type: array
          items:
            $ref: "#/components/schemas/GitFile"
          description: Files modified or added but not staged.
        untracked:
          type: array
          items:
            $ref: "#/components/schemas/GitFile"
          description: Files that are not yet tracked by git.
        deleted:
          type: array
          items:
            $ref: "#/components/schemas/GitFile"
          description: Files deleted but not staged.
        renamed:
          type: array
          items:
            $ref: "#/components/schemas/GitFile"
          description: Files renamed (the new path).
        truncated:
          type: boolean
          description: Whether any file list was truncated by the per-section limit.
        in_git_repo:
          type: boolean
          description: Whether the workspace is a git repository.
      required:
        - branch
        - ahead
        - behind
        - staged
        - modified
        - untracked
        - deleted
        - renamed
        - truncated
        - in_git_repo
    GitStatusResponse:
      type: object
      description: The response from /api/git/status.
      properties:
        message:
          type: string
        status:
          $ref: "#/components/schemas/GitStatus"
        files:
          type: array
          description: A flat, backward-compatible union of all the file lists.
          items:
            $ref: "#/components/schemas/GitFile"
        in_git_repo:
          type: boolean
          description: Whether the workspace is a git repository.
      required:
        - message
        - status
        - files
        - in_git_repo
    GitDiffResponse:
      type: object
      description: The response from /api/git/diff.
      properties:
        message:
          type: string
        path:
          type: string
          description: The file the diff is for, relative to the workspace root.
        has_staged:
          type: boolean
          description: Whether the file has staged changes.
        has_unstaged:
          type: boolean
          description: Whether the file has unstaged changes.
        staged_diff:
          type: string
          description: The staged (cached) unified diff.
        unstaged_diff:
          type: string
          description: The unstaged (working tree) unified diff.
        diff:
          type: string
          description: The combined staged and unstaged diff.
        original_content:
          type: string
          description: The before (HEAD) file content for the merge view; absent when the workspace is not a git repository.
        modified_content:
          type: string
          description: The after (working tree) file content for the merge view; absent when the workspace is not a git repository.
        contents_truncated:
          type: boolean
          description: Whether a content side was omitted for size or binary content; absent when the workspace is not a git repository.
      required:
        - message
        - path
        - has_staged
        - has_unstaged
        - staged_diff
        - unstaged_diff
        - diff
