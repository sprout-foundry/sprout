        newText:
          type: string
        to:
          description: The 0-based byte offset of the range end.
          type: integer
      required:
        - filePath
        - from
        - to
        - newText
      type: object
    SemanticDefinition:
      description: The target of a go-to-definition.
      properties:
        column:
          description: The 1-based column.
          type: integer
        line:
          description: The 1-based line.
          type: integer
        path:
