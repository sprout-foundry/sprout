        path:
          description: The file to analyze (workspace-relative or absolute). Required.
          type: string
        position:
          $ref: '#/components/schemas/SemanticPosition'
          description: Required for the position-dependent methods (definition, hover, rename, references, code_actions, signature_help).
        trigger:
