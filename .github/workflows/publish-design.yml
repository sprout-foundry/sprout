name: Publish @sprout-foundry/design

# Publish only on explicit version tags (design-v*). This avoids
# re-publish failures (409) when packages/design/** changes without
# a version bump. To publish: tag and push.
#   git tag design-v1.0.1 -m "design v1.0.1"
#   git push origin design-v1.0.1
on:
  push:
    tags:
      - 'design-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sprout-foundry'

      - name: Publish to GitHub Packages
        working-directory: packages/design
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
