          type: string
        last_updated:
          format: date-time
          type: string
        match_score:
          description: Relevance score; 1 (any term), 2 (all terms), 3 (exact phrase).
          type: integer
        name:
          type: string
        session_id:
          type: string
        total_cost:
          type: number
        working_directory:
          type: string
      required:
