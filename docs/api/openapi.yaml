  parameters:
    chatId:
      # Shared query-parameter form of the chat-scoping knob: the chat session
      # a route targets. Handlers read it from the URL query string (r.URL
      # .Query().Get("chat_id")); body-bearing routes carry it in the request
      # body instead. When omitted the client's active chat is used.
      name: chat_id
      in: query
      required: false
      description: The chat session to target; falls back to the client's active chat.
      schema:
        type: string
    limit:
      # Shared pagination: number of results per page. Mirrors the limit
      # semantics used by the paginated list endpoints (default 30, capped at
      # 100). Family items reference via $ref.
      name: limit
      in: query
      required: false
      description: Maximum number of results to return per page.
      schema:
        type: integer
        default: 30
        maximum: 100
    offset:
      # Shared pagination: number of results to skip before the first page.
      name: offset
      in: query
      required: false
      description: Number of results to skip before returning the page.
      schema:
        type: integer
        default: 0








