<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <!-- app-shell: Code mode default. Source: webui/src/AppContent.tsx, Sidebar.tsx, ChatView (structure).
       Palette tokens: {color.dark.bg.primary} {color.dark.bg.secondary} {color.dark.bg.elevated} {color.dark.bg.surface} {color.dark.border.subtle} {color.dark.border.default} {color.dark.text.primary} {color.dark.text.secondary} {color.dark.text.muted} {color.dark.accent.primary} {color.dark.brand.active-cyan} {color.dark.accent.success} {sizing.header.height} {sizing.terminal.reserved-height} {sizing.sidebar.width} {typography.size.sm} {typography.size.base} -->
  <style>
    .bg { fill: #282c34; }
    .panel { fill: #21252b; }
    .elev { fill: #303742; }
    .surf { fill: #3a404b; }
    .none { fill: none; }
    .b1 { fill: none; stroke: rgba(171, 178, 191, 0.14); }
    .b2 { fill: none; stroke: rgba(171, 178, 191, 0.22); }
    .t1 { fill: #abb2bf; font: 14px sans-serif; }
    .t2 { fill: #9aa3b2; font: 13px sans-serif; }
    .tm { fill: #5c6370; font: 12px sans-serif; }
    .ac { fill: #61afef; font: 14px sans-serif; }
    .cy { fill: #22d3ee; font: 14px sans-serif; }
    .cyb { fill: #22d3ee; }
    .acbg { fill: #61afef; }
    .onac { fill: #ffffff; font: 14px sans-serif; }
    .ok { fill: #98c379; font: 12px sans-serif; }
  </style>

  <!-- page background {color.dark.bg.primary} -->
  <rect x="0" y="0" width="1440" height="900" class="bg"/>

  <!-- sidebar {color.dark.bg.secondary} {sizing.sidebar.width} -->
  <rect x="0" y="0" width="288" height="900" class="panel"/>
  <line x1="288" y1="0" x2="288" y2="900" class="b1" stroke-width="1"/>

  <!-- pinned header: brandmark + mode switcher {sizing.header.height} -->
  <circle cx="22" cy="17" r="8" class="cyb"/>
  <text x="36" y="22" class="t2">sprout</text>
  <rect id="mode-switcher" x="96" y="4" width="76" height="27" rx="6" class="elev"/>
  <text x="108" y="22" class="t1">Code</text>
  <text x="142" y="22" class="tm">&#9662;</text>
  <!-- {color.dark.brand.active-cyan} active mode indicator underlines when open -->

  <!-- icon rail -->
  <rect x="0" y="35" width="48" height="865" class="none"/>
  <circle id="nav-git" cx="24" cy="72" r="10" class="none" data-nav="git-panel"/>
  <text x="17" y="77" class="tm">G</text>
  <rect id="nav-files" x="8" y="104" width="32" height="32" rx="6" class="elev" data-nav="editor"/>
  <text x="18" y="125" class="cy">F</text>
  <circle id="nav-search" cx="24" cy="168" r="10" class="none" data-nav="command-palette"/>
  <text x="17" y="173" class="tm">&#8964;</text>
  <circle id="nav-automations" cx="24" cy="212" r="10" class="none"/>
  <text x="17" y="217" class="tm">A</text>
  <circle id="nav-logs" cx="24" cy="256" r="10" class="none"/>
  <text x="17" y="261" class="tm">L</text>

  <!-- sidebar content pane: files section -->
  <text x="56" y="62" class="t2">Files</text>
  <text x="252" y="62" class="tm">128</text>
  <text x="56" y="90" class="t2">&#9656; src</text>
  <text x="56" y="112" class="t2">&#9656;   webui</text>
  <text id="file-row-1" x="56" y="134" class="ac">    App.tsx</text>
  <text id="file-row-2" x="56" y="156" class="t2">    App.css</text>
  <text x="56" y="178" class="t2">&#9654;   components</text>
  <text x="56" y="200" class="t2">&#9654;   workspaces</text>
  <text x="56" y="222" class="t2">&#9656; pkg</text>
  <text x="56" y="244" class="t2">&#9654;   design</text>
  <text x="56" y="266" class="t2">Makefile</text>
  <text x="56" y="288" class="t2">go.mod</text>

  <!-- header bar {sizing.header.height} -->
  <rect x="288" y="0" width="1152" height="35" class="panel"/>
  <line x1="288" y1="35" x2="1440" y2="35" class="b1" stroke-width="1"/>
  <text x="304" y="22" class="t2">Files</text>
  <text x="352" y="22" class="t2">Search</text>
  <text x="412" y="22" class="t2">Git</text>
  <text x="450" y="22" class="t2">Automations</text>
  <text x="536" y="22" class="t2">Logs</text>
  <rect x="1080" y="6" width="64" height="23" rx="4" class="elev"/>
  <text x="1090" y="22" class="ok">&#10003; main</text>
  <rect x="1152" y="6" width="118" height="23" rx="4" class="elev"/>
  <text x="1162" y="22" class="t2">qwen3.8-27b</text>
  <circle cx="1300" cy="17" r="10" class="elev"/>
  <text x="1295" y="22" class="t2">A</text>

  <!-- chat workspace -->
  <rect id="user-msg" x="900" y="70" width="520" height="54" rx="10" class="elev"/>
  <text x="920" y="100" class="t1">Add a token export for Swift.</text>
  <rect id="agent-msg-1" x="320" y="150" width="700" height="84" rx="10" class="none"/>
  <rect x="320" y="150" width="700" height="84" rx="10" class="elev" opacity="0.35"/>
  <text x="340" y="178" class="t1">On it — reading the DTCG parser first, then</text>
  <text x="340" y="200" class="t1">adding swift to the export targets.</text>
  <rect id="tool-pill" x="320" y="262" width="380" height="28" rx="14" class="none"/>
  <rect x="320" y="262" width="380" height="28" rx="14" class="elev" opacity="0.6"/>
  <text x="336" y="281" class="t2">&#9881; read_file &#183; pkg/design/export.go &#183; 1.2s</text>
  <rect id="agent-msg-2" x="320" y="318" width="620" height="64" rx="10" class="none"/>
  <rect x="320" y="318" width="620" height="64" rx="10" class="elev" opacity="0.35"/>
  <text x="340" y="346" class="t1">Done. Tokens exported to design/generated/.</text>
  <text x="340" y="368" class="ok">2 files changed &#183; build green</text>

  <!-- tool timeline bar -->
  <rect x="320" y="756" width="1080" height="32" rx="6" class="panel"/>
  <line x1="320" y1="756" x2="1400" y2="756" class="b2" stroke-width="1"/>
  <text x="336" y="777" class="tm">tools: 4 this turn &#183; 2 parallel &#183; &#9654; read_file &#9654; edit_file &#9654; shell_command &#10003; design_validate</text>

  <!-- composer -->
  <rect id="composer" x="320" y="800" width="1080" height="48" rx="10" class="panel"/>
  <line x1="320" y1="800" x2="1400" y2="848" class="b2" stroke-width="1"/>
  <rect x="320" y="800" width="1080" height="48" rx="10" class="none" style="fill:rgba(171, 178, 191, 0.06)"/>
  <text x="340" y="829" class="tm">Message sprout&#8230; (&#8984;&#8679; to send)</text>
  <circle cx="1310" cy="824" r="9" class="none"/>
  <text x="1305" y="829" class="tm">&#128206;</text>
  <rect x="1330" y="810" width="44" height="28" rx="6" class="none"/>
  <rect x="1330" y="810" width="44" height="28" rx="6" class="acbg"/>
  <text x="1340" y="829" class="onac" font-size="14">&#9654;</text>

  <!-- terminal strip {color.dark.bg.surface} {sizing.terminal.reserved-height} -->
  <rect id="terminal" x="288" y="858" width="1152" height="42" class="surf"/>
  <line x1="288" y1="858" x2="1440" y2="858" class="b1" stroke-width="1"/>
  <text x="304" y="884" class="t2">Terminal &#183; /bin/zsh &#183; &#8984;J to focus</text>
  <text x="1320" y="884" class="tm">exit 0</text>
</svg>
