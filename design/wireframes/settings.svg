<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <!-- settings: settings panel (providers, models, theme, UI scale). Source: webui/src SettingsPanel structure.
       Palette tokens: {color.dark.bg.primary} {color.dark.bg.secondary} {color.dark.bg.tertiary} {color.dark.bg.elevated} {color.dark.bg.success} {color.dark.border.subtle} {color.dark.border.default} {color.dark.text.primary} {color.dark.text.secondary} {color.dark.text.muted} {color.dark.accent.primary} {radius.md} {radius.xl} {sizing.control.icon-button} -->
  <style>
    .bg { fill: #282c34; }
    .panel { fill: #21252b; }
    .tertiary { fill: #2c313a; }
    .elev { fill: #303742; }
    .none { fill: none; }
    .b1 { fill: none; stroke: rgba(171, 178, 191, 0.14); }
    .b2 { fill: none; stroke: rgba(171, 178, 191, 0.22); }
    .t1 { fill: #abb2bf; font: 14px sans-serif; }
    .t2 { fill: #9aa3b2; font: 13px sans-serif; }
    .tm { fill: #5c6370; font: 12px sans-serif; }
    .ac { fill: #61afef; font: 13px sans-serif; }
    .ok { fill: #98c379; font: 12px sans-serif; }
    .cyb { fill: #22d3ee; }
    .acbg { fill: #61afef; }
    .onac { fill: #ffffff; font: 13px sans-serif; }
    .okb { fill: #98c379; }
    .errb { fill: #e06c75; }
    .cyline { fill: none; stroke: #22d3ee; }
    .acline { fill: none; stroke: #61afef; }
    .acdot { fill: #61afef; }
  </style>

  <!-- dimmed app behind the panel -->
  <rect x="0" y="0" width="1440" height="900" class="bg"/>
  <rect x="0" y="0" width="288" height="900" class="panel" opacity="0.4"/>
  <rect x="312" y="72" width="480" height="60" rx="10" class="elev" opacity="0.2"/>

  <!-- panel {radius.xl} {color.dark.bg.secondary} -->
  <rect x="240" y="60" width="960" height="780" rx="12" class="panel"/>
  <line x1="240" y1="60" x2="1200" y2="840" class="b2" stroke-width="1"/>
  <text x="272" y="96" class="t1">Settings</text>
  <text id="close" x="1164" y="96" class="tm" data-nav="app-shell">&#215;</text>

  <!-- left nav -->
  <text id="sec-providers" x="272" y="140" class="ac" data-nav="settings">Providers</text>
  <text id="sec-models" x="272" y="172" class="t2" data-nav="settings">Models</text>
  <text id="sec-theme" x="272" y="204" class="t2" data-nav="settings">Theme</text>
  <text id="sec-scale" x="272" y="236" class="t2" data-nav="settings">UI Scale</text>
  <line x1="272" y1="150" x2="340" y2="150" class="cyline" stroke-width="2"/>
  <line x1="256" y1="270" x2="1184" y2="270" class="b1" stroke-width="1"/>

  <!-- providers section -->
  <text x="420" y="140" class="t2">Providers</text>
  <rect x="420" y="156" width="764" height="40" rx="6" class="tertiary"/>
  <circle cx="444" cy="176" r="5" class="okb"/>
  <text x="462" y="181" class="t2">ai-worker &#183; https://ai-worker.internal &#183; qwen, gemma</text>
  <text x="1120" y="181" class="ok">healthy</text>
  <rect x="420" y="204" width="764" height="40" rx="6" class="tertiary"/>
  <circle cx="444" cy="224" r="5" class="errb"/>
  <text x="462" y="229" class="t2">zai-coding &#183; https://api.z.ai &#183; glm</text>
  <text x="1120" y="229" class="tm">retrying</text>
  <rect x="1148" y="156" width="36" height="40" rx="6" class="none"/>
  <rect x="1148" y="156" width="36" height="40" rx="6" class="elev"/>
  <text x="1158" y="181" class="t2">+</text>

  <!-- models section -->
  <text x="420" y="292" class="t2">Models</text>
  <rect id="model-1" x="420" y="308" width="180" height="40" rx="6" class="none"/>
  <rect x="420" y="308" width="180" height="40" rx="6" class="elev" opacity="0.5"/>
  <line x1="420" y1="308" x2="600" y2="348" class="acline" stroke-width="1.5"/>
  <text x="436" y="333" class="t1">qwen3.8-27b</text>
  <text x="436" y="349" class="tm">default</text>
  <rect id="model-2" x="612" y="308" width="180" height="40" rx="6" class="none"/>
  <rect x="612" y="308" width="180" height="40" rx="6" class="elev"/>
  <text x="628" y="333" class="t2">glm-5.3-flash</text>
  <rect id="model-3" x="804" y="308" width="180" height="40" rx="6" class="none"/>
  <rect x="804" y="308" width="180" height="40" rx="6" class="elev"/>
  <text x="820" y="333" class="t2">gemma4-e2b</text>
  <rect id="model-4" x="996" y="308" width="180" height="40" rx="6" class="none"/>
  <rect x="996" y="308" width="180" height="40" rx="6" class="elev"/>
  <text x="1012" y="333" class="t2">minicpm5-2b</text>

  <!-- theme section -->
  <text x="420" y="400" class="t2">Theme</text>
  <rect id="theme-dark" x="420" y="416" width="120" height="36" rx="6" class="none"/>
  <rect x="420" y="416" width="120" height="36" rx="6" class="elev" opacity="0.5"/>
  <line x1="420" y1="416" x2="540" y2="452" class="acline" stroke-width="1.5"/>
  <text x="448" y="439" class="t1">Dark</text>
  <rect id="theme-light" x="552" y="416" width="120" height="36" rx="6" class="none"/>
  <rect x="552" y="416" width="120" height="36" rx="6" class="elev"/>
  <text x="576" y="439" class="t2">Light</text>

  <!-- scale section -->
  <text x="420" y="500" class="t2">UI Scale</text>
  <text x="420" y="524" class="tm">compact</text>
  <text x="560" y="524" class="t1">default</text>
  <text x="700" y="524" class="tm">large</text>
  <line x1="430" y1="540" x2="760" y2="540" class="b2" stroke-width="3"/>
  <circle id="scale-thumb" cx="570" cy="540" r="8" class="acdot"/>
  <text x="780" y="545" class="tm">100&#37;</text>
</svg>
