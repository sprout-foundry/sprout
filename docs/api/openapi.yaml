      description: Adds every changed file to the git index.
      operationId: gitStageAll
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitMessageResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The changes could not be staged.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Stage all changes.
      tags:
        - git
  /api/git/status:
    get:
      description: 'Reports the workspace''s git status: staged, unstaged, and untracked changes, plus branch and ahead/behind counts.'
      operationId: gitStatus
