        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitStatusResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The git status could not be read.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Report the workspace's git status.
      tags:
        - git
  /api/git/unstage:
    post:
      description: Removes the file at `path` from the git index.
      operationId: gitUnstage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitFileOperationRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitFileOperationResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid JSON, a missing or invalid path, or the file is not part of the git changes.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The file could not be unstaged.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Unstage a file.
      tags:
        - git
  /api/git/unstage-all:
    post:
      description: Removes every staged file from the git index.
      operationId: gitUnstageAll
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitMessageResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The changes could not be unstaged.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Unstage all changes.
      tags:
        - git
  /api/git/worktree/checkout:
    post:
      description: Switches the client's active workspace to the git worktree at `path`.
      operationId: gitWorktreeCheckout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitWorktreePathRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitWorktreeCheckoutResponse'
