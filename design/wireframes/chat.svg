<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <!-- chat: chat surface. Source: webui/src/ChatView structure (timeline, tool timeline bar, composer, queue).
       Palette tokens: {color.dark.bg.primary} {color.dark.bg.secondary} {color.dark.bg.elevated} {color.dark.bg.info} {color.dark.bg.success} {color.dark.border.subtle} {color.dark.border.default} {color.dark.text.primary} {color.dark.text.secondary} {color.dark.text.muted} {color.dark.accent.primary} {color.dark.subagent.depth-0} {color.dark.subagent.depth-1} {typography.size.sm} {typography.size.base} {typography.size.lg} -->
  <style>
    .bg { fill: #282c34; }
    .panel { fill: #21252b; }
    .elev { fill: #303742; }
    .none { fill: none; }
    .b1 { fill: none; stroke: rgba(171, 178, 191, 0.14); }
    .b2 { fill: none; stroke: rgba(171, 178, 191, 0.22); }
    .t1 { fill: #abb2bf; font: 14px sans-serif; }
    .t2 { fill: #9aa3b2; font: 13px sans-serif; }
    .tm { fill: #5c6370; font: 12px sans-serif; }
    .ac { fill: #61afef; font: 14px sans-serif; }
    .ok { fill: #98c379; font: 12px sans-serif; }
    .warn { fill: #e5c07b; font: 12px sans-serif; }
    .d0 { fill: #818cf8; font: 12px sans-serif; }
    .d1 { fill: #a78bfa; font: 12px sans-serif; }
    .acbg { fill: #61afef; }
    .onac { fill: #ffffff; font: 14px sans-serif; }
    .d0b { fill: #818cf8; }
    .d1b { fill: #a78bfa; }
  </style>

  <rect x="0" y="0" width="1440" height="900" class="bg"/>

  <!-- session header -->
  <rect x="0" y="0" width="1440" height="35" class="panel"/>
  <line x1="0" y1="35" x2="1440" y2="35" class="b1" stroke-width="1"/>
  <text id="back" x="16" y="22" class="t2" data-nav="app-shell">&#9664; session-2026-09-22</text>
  <rect x="1150" y="6" width="128" height="23" rx="4" class="elev"/>
  <text x="1160" y="22" class="t2">qwen3.8-27b</text>
  <rect x="1290" y="6" width="80" height="23" rx="11" class="elev"/>
  <text x="1304" y="22" class="ac">42&#37; ctx</text>
  <text x="1378" y="22" class="tm">&#8984;K</text>

  <!-- message timeline -->
  <!-- user message (right-aligned) -->
  <rect x="860" y="70" width="560" height="58" rx="10" class="elev"/>
  <text x="880" y="94" class="t1">Refactor the mode switcher to portal the menu.</text>
  <text x="880" y="114" class="tm">08:41 &#183; user</text>
  <!-- agent message -->
  <rect x="60" y="152" width="760" height="96" rx="10" class="none"/>
  <rect x="60" y="152" width="760" height="96" rx="10" class="elev" opacity="0.35"/>
  <text x="80" y="180" class="t1">The sidebar clips the menu (overflow hidden). I&#8217;ll portal it</text>
  <text x="80" y="202" class="t1">to document.body with createPortal and re-anchor the styles.</text>
  <text x="80" y="228" class="tm">agent &#183; 6s</text>
  <!-- tool events -->
  <rect x="60" y="270" width="430" height="28" rx="14" class="none"/>
  <rect x="60" y="270" width="430" height="28" rx="14" class="elev" opacity="0.6"/>
  <text x="76" y="289" class="t2">&#9881; read_file &#183; ModeSwitcher.tsx &#183; 0.4s</text>
  <rect x="60" y="308" width="470" height="28" rx="14" class="none"/>
  <rect x="60" y="308" width="470" height="28" rx="14" class="elev" opacity="0.6"/>
  <text x="76" y="327" class="t2">&#9881; edit_file &#183; ModeSwitcher.tsx &#183; 1.1s</text>
  <!-- subagent block (depth accents) {color.dark.subagent.depth-0} {color.dark.subagent.depth-1} -->
  <rect x="60" y="356" width="560" height="74" rx="8" class="none"/>
  <rect x="60" y="356" width="4" height="74" rx="2" class="d0b"/>
  <text x="80" y="380" class="d0">subagent: coder &#183; portal + css scoping</text>
  <rect x="84" y="392" width="500" height="24" rx="4" class="none"/>
  <rect x="84" y="392" width="4" height="24" rx="2" class="d1b"/>
  <text x="96" y="409" class="d1">subagent: tester &#183; ModeSwitcher.test.tsx</text>
  <!-- todo list -->
  <rect x="60" y="452" width="400" height="92" rx="8" class="none"/>
  <rect x="60" y="452" width="400" height="92" rx="8" class="elev" opacity="0.35"/>
  <text x="80" y="476" class="ok">&#10003; portal menu out of sidebar clip</text>
  <text x="80" y="498" class="ok">&#10003; scope css to portal root</text>
  <text x="80" y="520" class="warn">&#9675; run vitest + playwright e2e</text>
  <!-- agent result -->
  <rect x="60" y="568" width="640" height="64" rx="10" class="none"/>
  <rect x="60" y="568" width="640" height="64" rx="10" class="elev" opacity="0.35"/>
  <text x="80" y="596" class="t1">All green: 292 files, 6994 tests. E2E 10/10.</text>
  <text x="80" y="618" class="ok">3 files changed &#183; vitest pass &#183; playwright 10 passed</text>

  <!-- tool timeline bar -->
  <rect x="60" y="744" width="1320" height="34" rx="6" class="panel"/>
  <line x1="60" y1="744" x2="1380" y2="744" class="b2" stroke-width="1"/>
  <text x="76" y="766" class="tm">turn 4 &#183; tools: read_file &#9654; edit_file &#9654; shell_command &#10003; &#9654; run_subagent &#10003; &#183; 2 parallel at peak &#183; 31.2s total</text>

  <!-- queued messages -->
  <rect x="60" y="792" width="1320" height="24" rx="6" class="none"/>
  <rect x="60" y="792" width="1320" height="24" rx="6" class="elev" opacity="0.35"/>
  <text x="76" y="808" class="tm">queued: 1 message (sent when the current turn finishes)</text>

  <!-- composer -->
  <rect x="60" y="826" width="1320" height="62" rx="10" class="panel"/>
  <line x1="60" y1="826" x2="1380" y2="888" class="b2" stroke-width="1"/>
  <text x="80" y="850" class="tm">Message sprout&#8230; (&#8984;&#8679; to send, shift+enter for newline)</text>
  <rect x="80" y="858" width="10" height="10" rx="2" class="none"/>
  <line x1="80" y1="868" x2="1364" y2="868" class="b1" stroke-width="1"/>
  <circle cx="1240" cy="864" r="10" class="none"/>
  <text x="1235" y="869" class="tm">&#128206;</text>
  <rect x="1262" y="848" width="104" height="26" rx="6" class="elev"/>
  <text x="1272" y="865" class="t2">qwen3.8-27b &#9662;</text>
  <rect x="1372" y="846" width="44" height="30" rx="6" class="acbg"/>
  <text x="1384" y="866" class="onac">&#9654;</text>
  <circle cx="1224" cy="832" r="8" class="none"/>
  <line x1="1216" y1="824" x2="1232" y2="840" class="b2" stroke-width="1.5"/>
  <line x1="1232" y1="824" x2="1216" y2="840" class="b2" stroke-width="1.5"/>
</svg>
