name: Pricing Audit Agent
on:
  schedule:
    - cron: "27 9 * * *"
  workflow_dispatch:

concurrency:
  group: pricing-audit
  cancel-in-progress: true

jobs:
  create-task:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Create or reuse pricing audit issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure the label exists
          gh label create "pricing-audit" --color "7057ff" \
            --description "Automated pricing audit tasks" 2>/dev/null || true

          # Reuse an existing open issue labeled pricing-audit, or create one
          EXISTING=$(gh issue list --label "pricing-audit" --state open \
            --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            ISSUE_NUMBER="$EXISTING"
          else
            ISSUE_NUMBER=$(gh issue create \
              --title "Pricing Audit: verify provider pricing against official docs" \
              --label "pricing-audit" \
              --body "Automated pricing audit task. The agent will fetch official pricing pages, compare against provider configs, and open a PR with corrections." \
            | grep -oE '[0-9]+$')
          fi

          # Post the task body (with /sprout-fix trigger) from the checked-in file.
          gh issue comment "$ISSUE_NUMBER" --body-file .github/pricing-audit-task.md
          echo "Posted /sprout-fix task to issue #$ISSUE_NUMBER"
