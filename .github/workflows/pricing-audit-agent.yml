name: Pricing Audit Agent
on:
  schedule:
    - cron: "27 9 * * *"
  workflow_dispatch:

concurrency:
  group: pricing-audit
  cancel-in-progress: true

jobs:
  pricing-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      BRANCH: pricing-audit/${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_URL=$(gh issue create \
            --title "Pricing Audit $(date -u +%Y-%m-%d)" \
            --body "Automated pricing audit run. Agent will verify provider pricing against official docs and create a PR with corrections.")
          ISSUE_NUM=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "ISSUE_NUM=$ISSUE_NUM" >> $GITHUB_ENV
          echo "Created issue #$ISSUE_NUM"

      - name: Install sprout
        run: |
          curl -fsSL https://raw.githubusercontent.com/sprout-foundry/sprout/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run pricing audit agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          git checkout -b "$BRANCH"

          sprout "Read the task in .github/pricing-audit-task.md and execute it. \
            Run go build ./cmd/audit_pricing/... and go test ./cmd/audit_pricing/... when done. \
            Commit your changes." \
            --provider deepseek \
            --model deepseek-v4-pro \
            --risk-profile permissive \
            --max-budget-usd 3.00

      - name: Validate only pricing files changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only --cached)
          if [ -z "$CHANGED" ]; then
            echo "No changes produced by agent"
            exit 0
          fi
          for f in $CHANGED; do
            case "$f" in
              pkg/agent_providers/configs/*.json|cmd/audit_pricing/manifest.json|cmd/audit_pricing/manifest.go) ;;
              *) echo "ERROR: unexpected file changed: $f"; exit 1 ;;
            esac
          done
          echo "All changed files are within allowed paths"

      - name: Push and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet HEAD~1 HEAD 2>/dev/null; then
            echo "No changes — agent found no drift"
            if [ -n "$ISSUE_NUM" ]; then
              gh issue close "$ISSUE_NUM" --comment "No pricing drift found. All configs match official docs."
            fi
            exit 0
          fi

          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "fix(pricing): automated pricing audit $(date -u +%Y-%m-%d)" \
            --body "Automated pricing audit corrections from issue #$ISSUE_NUM.

          Closes #$ISSUE_NUM." \
            --base main \
            --head "$BRANCH")

          if [ -n "$ISSUE_NUM" ]; then
            gh issue comment "$ISSUE_NUM" --body "Pricing audit complete: $PR_URL"
          fi
