        - git
  /api/git/worktrees:
    get:
      description: Lists the repository's git worktrees.
      operationId: gitWorktrees
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitWorktreesResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The worktree list could not be read.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List git worktrees.
      tags:
        - git
  /api/lsp/status:
    get:
      description: Lists the configured language servers with their supported languages, binary, install hint, and whether the binary is resolvable on PATH, plus the count of currently active LSP sessions and the workspace root.
      operationId: lspStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LSPStatusResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Report available and active LSP servers.
      tags:
        - terminal
  /api/lsp/ws:
    get:
      description: Upgrades the request to a WebSocket (101 Switching Protocols) and bridges it to the language-server process for the `language` in the `workspace`. Raw LSP messages then flow over the frame channel; there is no JSON request/response body. Both `language` and `workspace` are required.
      operationId: lspWebSocket
      parameters:
        - description: The language ID for the language server to bridge.
          in: query
          name: language
          required: true
          schema:
            type: string
        - description: The workspace path the language server serves.
          in: query
          name: workspace
          required: true
          schema:
            type: string
      responses:
        "101":
          description: The connection was upgraded to a WebSocket; LSP messages flow over the frame channel.
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: The `language` or `workspace` query parameter is missing.
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: The workspace path is not allowed.
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: The language server could not be started.
      summary: Open an LSP WebSocket bridge.
      tags:
        - terminal
  /api/query:
    post:
      description: Submits a query to the agent for the resolved chat (body `chat_id` or the client's active chat) and starts the query lifecycle asynchronously. The response is written by the shared runner, so this operation reports a 202 Accepted with the submitted query text.
      operationId: queryStart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        "200":
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryAcceptedResponse'
          description: The query was accepted and is running.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Malformed body, missing query text, or an unsafe command.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The client context was not found.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A query is already running for this chat or workspace.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An internal error occurred.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No AI provider is configured.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Start a query in a chat session.
      tags:
        - conversation/query
  /api/query/rewind:
    post:
      description: Truncates the conversation history back to a prior turn, optionally reverting file changes made during the discarded turns. Requires `to_turn`.
      operationId: queryRewind
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRewindRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryRewindResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing to_turn, an unknown client context, or a rewind failure.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A query is currently running.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An internal error occurred.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No AI provider is configured.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Rewind the conversation to a prior turn.
      tags:
        - conversation/query
  /api/query/status:
    get:
      description: Reports whether a query is currently active for the resolved chat. A polling fallback for when the WebSocket drops and reconnects.
      operationId: queryStatus
      parameters:
        - $ref: '#/components/parameters/chatId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryStatusResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Active-query status for a chat.
      tags:
        - conversation/query
  /api/query/steer:
    post:
      description: Injects user input into the currently running query loop, or executes a safe slash command mid-turn. Requires an active query.
      operationId: querySteer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuerySteerRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteerCommandResponse'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteerAcceptedResponse'
          description: The steer input was accepted into the active query.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Malformed body, missing query, or a non-steerable slash command.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No active query to steer.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An internal error occurred.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No AI provider is configured.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Steer an active query.
      tags:
        - conversation/query
  /api/query/steer/retract:
    post:
      description: Pulls back the newest staged-but-unpicked steer message so the user can edit it. Returns 200 with success=false when nothing is pending.
      operationId: querySteerRetract
      requestBody:
        content:
          application/json:
            schema:
              properties:
                chat_id:
                  description: Target chat session; falls back to the client's active chat.
                  type: string
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteerRetractResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An internal error occurred.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No AI provider is configured.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Retract the latest staged steer.
      tags:
        - conversation/query
  /api/query/stop:
    post:
      description: Interrupts the currently running query loop and cancels its subagents. Returns 200 already_completed when there is nothing to stop.
      operationId: queryStop
      parameters:
        - $ref: '#/components/parameters/chatId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryStopAlreadyCompleted'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryStopAccepted'
          description: The active query was interrupted.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An internal error occurred.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No AI provider is configured.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Stop the active query.
      tags:
        - conversation/query
  /api/rename:
    post:
      description: Renames (or moves) the item at `old_path` to `new_path`, creating the target's parent directory as needed. Fails with 404 when the source is missing and 409 when the target already exists.
      operationId: renameItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileRenameRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRenameResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Malformed body, missing paths, or an invalid path.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A path is outside the workspace.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The source path does not exist.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The target path already exists.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The rename failed.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Rename or move a file or directory.
      tags:
        - files
  /api/search:
    get:
      description: Searches the workspace files for matches of `query`, returning the matched lines with surrounding context. The search is bounded by a timeout and by a file-walk and match cap; when any cap is hit the result is marked truncated.
      operationId: searchQuery
      parameters:
        - description: The text (or regex, when `regex=true`) to search for.
          in: query
          name: query
          required: true
          schema:
            type: string
        - description: Match case exactly when "true".
          in: query
          name: case_sensitive
          required: false
          schema:
            default: "false"
            type: string
        - description: Match whole words when "true".
          in: query
          name: whole_word
          required: false
          schema:
            default: "false"
            type: string
        - description: Treat `query` as a regular expression when "true".
          in: query
          name: regex
          required: false
          schema:
            default: "false"
            type: string
        - description: Maximum number of matches; when omitted the default is 500, capped at 5000.
          in: query
          name: max_results
          required: false
          schema:
            type: string
        - description: Number of context lines before and after a match; when omitted the default is 2.
          in: query
          name: context_lines
          required: false
          schema:
            type: string
        - description: Comma-separated path patterns to include.
          in: query
          name: include
          required: false
          schema:
            type: string
        - description: Comma-separated path patterns to exclude.
          in: query
          name: exclude
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing query, or a query that is too long.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        "408":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The search timed out.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The search failed (for example an invalid regex).
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Search for matches across workspace files.
      tags:
        - search
  /api/search/replace:
    post:
      description: Replaces matches of `search` with `replace` within the listed `files`, honoring the same case/whole-word/regex modifiers as the search. When `preview` is true the changes are computed but not written. Files are restricted to the workspace.
      operationId: searchReplace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Malformed body, a missing or oversized pattern, a file outside the workspace, or an invalid search pattern.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The replacement failed.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Search and replace across files.
      tags:
        - search
  /api/semantic:
    post:
      description: Runs one language-semantic method (diagnostics, definition, hover, rename, references, code_actions, inlay_hints, or signature_help) for the file at `path` in `language_id`, dispatched to the matching language-server adapter. The position-dependent methods (definition, hover, rename, references, code_actions, signature_help) require `position`. An unknown language returns an empty capabilities set.
      operationId: semanticRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemanticRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Malformed body, a missing path, an invalid method, a missing position, or an invalid path.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The path is outside the workspace.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Run a semantic analysis method on a file.
      tags:
        - diagnostics
  /api/sessions:
    get:
      description: Lists saved sessions with message count and token metadata, scoped by the `scope` query parameter.
      operationId: sessionsList
      parameters:
        - description: Sessions for the current workspace (current, the default) or across all workspaces (all).
          in: query
          name: scope
          required: false
          schema:
            default: current
            enum:
              - current
              - all
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsListResponse'
          description: OK
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Failed to list sessions.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List saved sessions.
      tags:
        - conversation/query
  /api/sessions/{id}/export:
    get:
      description: Streams a saved session to a downloadable file (json or markdown) with a Content-Disposition header.
      operationId: sessionExport
      parameters:
        - description: The saved session ID to export.
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: The export format.
          in: query
          name: format
          required: false
          schema:
            default: markdown
            enum:
              - markdown
              - html
              - json
            type: string
        - description: Include tool calls when "true" (default false).
          in: query
          name: include_tool_calls
          required: false
          schema:
            type: string
        - description: Include cost when not "false" (default true).
          in: query
          name: include_cost
          required: false
          schema:
            type: string
        - description: Skip secret redaction when "true" (default false).
          in: query
          name: no_secret_redaction
          required: false
          schema:
            type: string
        - description: Resolve the session within this working directory.
          in: query
          name: cwd
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            text/html:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid format, or a missing session ID.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The session was not found.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Failed to load or export the session.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Export a saved session to a downloadable file.
      tags:
        - conversation/query
  /api/sessions/restore:
    post:
      description: Restores a saved session into the client's active (or a specified) chat and publishes the recovered messages.
      operationId: sessionRestore
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRestoreRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRestoreResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing session ID, or the session could not be loaded.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An internal error occurred.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Restore a saved session.
      tags:
        - conversation/query
  /api/sessions/search:
    get:
      description: Searches saved sessions' transcripts for a query string.
      operationId: sessionsSearch
      parameters:
        - description: The search query string.
          in: query
          name: q
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - description: Restrict to sessions in this working directory.
          in: query
          name: cwd
          required: false
          schema:
            type: string
        - description: Only sessions last updated on or after this date (RFC3339 or YYYY-MM-DD).
          in: query
          name: since
          required: false
          schema:
            type: string
        - description: Only sessions last updated on or before this date (RFC3339 or YYYY-MM-DD).
          in: query
          name: until
          required: false
          schema:
            type: string
        - description: Force a full index rebuild when "true" or "1".
          in: query
          name: reindex
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsSearchResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing query, or an invalid date or limit.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts GET.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Failed to build or search the index.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Search across saved sessions.
      tags:
        - conversation/query
  /api/shell-approvals/:
    post:
      description: Submits per-part accept/reject choices for a pending shell approval at the /api/shell-approvals/{id}/decision shape, unblocking the agent's shell-approval broker.
      operationId: shellApprovalDecision
      parameters:
        - description: The dynamic sub-segment(s); the documented shape is {id}/decision.
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShellApprovalDecisionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShellApprovalDecisionResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing request ID, or the decisions map is required.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request ID is unknown or expired.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No agent is available to receive the decision.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Submit a per-part shell approval decision.
      tags:
        - conversation/query
  /api/stats:
    get:
      description: Reports server and per-client statistics, including provider, model, and token usage.
      operationId: get-stats
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Server statistics
      tags:
        - diagnostics
  /api/subagent/:
    post:
      description: 'Cancels one running subagent in the active chat at the /api/subagent/{id}/cancel shape. Idempotent: a non-running ID returns a 200 already_completed payload.'
      operationId: subagentCancel
      parameters:
        - description: The dynamic sub-segment(s); the documented shape is {id}/cancel.
          in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/chatId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentCancelResponse'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentCancelResponse'
          description: The subagent was cancelled.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No subagent runner for this chat.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An internal error occurred.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No AI provider is configured.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Cancel a running subagent.
      tags:
        - conversation/query
  /api/upload/image:
    post:
      description: Accepts an image either as a raw body or as a multipart form field named `image`. The image format is validated by magic bytes and the file is saved into the workspace; the response returns the absolute path and filename so the client can reference it in a message.
      operationId: uploadImage
      requestBody:
        content:
          application/octet-stream:
            schema:
              description: The raw image bytes.
              format: binary
              type: string
          multipart/form-data:
            schema:
              properties:
                image:
                  description: The image to upload (form field `image`).
                  format: binary
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The body could not be read, or is not a recognized image format.
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The route only accepts POST.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The image could not be saved.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Upload an image for use in a chat.
      tags:
        - files
tags:
  - description: Query lifecycle, steering, command execution, and completions.
    name: conversation/query
  - description: File browsing, reads/writes, create/delete/rename, and edits.
    name: files
  - description: Git status, history, diffs, commits, branches, and worktrees.
    name: git
  - description: Settings, providers, onboarding, hotkeys, skills, and config.
    name: settings
  - description: Terminal, agent-session, and language-server (LSP) surfaces.
    name: terminal
  - description: Workspace metadata and remote instance/SSH management.
    name: workspace/instances
  - description: File sync operations and container-side git transactions.
    name: sync/txn
  - description: Chat sessions and worktree session mappings.
    name: sessions
  - description: Search and search-and-replace across files.
    name: search
  - description: Diagnostics, semantic analysis, stats, and support bundles.
    name: diagnostics
  - description: Design-tree status and signals.
    name: design
  - description: Starter project catalogue and instantiation.
    name: starters
  - description: Bootstrap, static assets, and other non-family routes.
    name: misc/static
