name: Build and Test

on:
  push:
    branches:
      - main
  # No branch filter: stacked PRs (base = another feature branch) must run
  # the same gates as PRs targeting main.
  pull_request:
  workflow_dispatch:

# pull-requests: read lets golangci-lint-action diff new-issue detection
# against the PR base via the GitHub API.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Primary gate: linux + macOS run the full pipeline (lint, build, vitest,
  # unit tests with coverage, smoke). Windows is deliberately NOT in this
  # matrix — its instrumented coverage run took 41 minutes vs 13 on Linux
  # and gated every release behind the slowest OS. Windows runs the same
  # suite in the parallel `test-windows` job below, off the critical path.
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        # Full history so golangci-lint's only-new-issues diff is accurate.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        else
          # Install basic dependencies for integration tests
          pip install requests pytest
        fi

    - name: Install dependencies
      run: go mod download

    - name: Install Chromium (headless browser for design_render / analyze_ui_screenshot)
      # The render-tier tests (pkg/agent/design_e2e_test.go) rasterize real SVG
      # and HTML through webcontent's headless browser. Without a browser the
      # rod launcher self-provisions one: a slow, network-dependent download
      # inside a test run. Installing it here keeps that deterministic, and
      # SPROUT_REQUIRE_BROWSER below makes the tests fail rather than skip if a
      # browser really is absent — so "the render path ran" is asserted, not
      # assumed from a green suite that skipped it.
      #
      # The binary must land on a path webcontent.systemBrowserPaths() probes.
      # Ubuntu's `chromium`/`chromium-browser` packages are snap transitional
      # stubs (candidate 2:1snap1) that install no real binary, so install
      # Google Chrome from the dl.google.com apt repo instead and verify the
      # path rod will actually find.
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        test -x /usr/bin/google-chrome-stable || { echo "chrome not at /usr/bin/google-chrome-stable"; exit 1; }
        /usr/bin/google-chrome-stable --version

    - name: Install MLX C library (macOS)
      if: runner.os == 'macOS' && runner.arch == 'ARM64'
      run: brew install mlx-c

    - name: Run go vet
      run: make vet

    - name: Check gofmt
      run: make fmt-check

    - name: Lint Go (new code only)
      # New-code gate: the repo predates golangci-lint, so a full-repo gate
      # would block every PR on the historical backlog (431 findings as of
      # 2026-09-19, see `make lint-go`). only-new-issues diffs against the
      # PR base or the push range. Needs a full fetch for accurate diffs
      # and pull-requests: read for the GitHub-API diff path.
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.5.0
        only-new-issues: true

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install Node.js dependencies (root workspaces)
      # Single `npm ci` from root installs every workspace
      # (packages/events, packages/ui, webui) plus root devDeps.
      # Per-workspace `npm install` in the past pruned root devDeps.
      run: npm ci

    - name: Build shared workspace packages
      # webui imports @sprout/events and @sprout/ui from their `dist/`
      # outputs (no `prepare` script — removed in 61ba3f17).
      run: |
        npm run build -w @sprout/events
        npm run build -w @sprout/ui

    - name: Lint frontend
      run: make lint

    - name: Check for duplicate components (SP-039 enforcement)
      run: bash scripts/check-no-duplicate-components.sh

    - name: Run full build pipeline (make build-all)
      run: make build-all

    - name: Run webui unit tests (vitest)
      continue-on-error: true
      run: npx vitest run --reporter=verbose
      working-directory: webui
      env:
        CI: "true"
        VITEST_MAX_FORKS: "2"

    - name: Commit updated UI assets
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add pkg/webui/static/
        git diff --cached --quiet || git commit -m "chore: update embedded UI assets [skip ci]"

    - name: Install goimports
      run: go install golang.org/x/tools/cmd/goimports@latest

    - name: Run unit tests with coverage
      # Go 1.25's test runner crashes with STATUS_DLL_INIT_FAILED
      # (0xC000013A) on Windows AFTER all tests pass — an unrecoverable
      # OS-level process kill that no shell error handling can intercept.
      # All packages report "ok"; the crash is in Go's test-binary
      # teardown, not in any test. Race detection disabled across all
      # platforms — the -race flag adds 4-5x overhead pushing CI past the
      # 6-hour runner limit. Local development can still run with -race.
      continue-on-error: ${{ runner.os == 'Windows' }}
      env:
        CI: "true"
        TEST_P: "1"
        TEST_PARALLEL: "2"
        TEST_RACE: ""
        TEST_COVER: ${{ runner.os == 'Windows' && 'no' || '' }}
        # Linux installs a browser in the step above, so require it there: the
        # render-tier tests then fail instead of skipping, and "the render path
        # ran" is asserted rather than assumed from a green suite that skipped
        # it. Unset elsewhere so a runner without a browser skips (visibility
        # is provided by the requirement on the platform we control).
        SPROUT_REQUIRE_BROWSER: ${{ runner.os == 'Linux' && '1' || '' }}
      run: make test-coverage

    - name: Display coverage summary
      if: always()
      continue-on-error: true
      run: |
        if [ -f /tmp/sprout-coverage.out ]; then
          go tool cover -func=/tmp/sprout-coverage.out > /tmp/sprout-coverage.txt
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          awk '/^total:/ {print $0}' /tmp/sprout-coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages with Lowest Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          awk '!/^total:/ {print $NF, $0}' /tmp/sprout-coverage.txt | sort -n | head -15 | awk '{$1=""; print substr($0,2)}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Coverage file not found at /tmp/sprout-coverage.out" >> $GITHUB_STEP_SUMMARY
          echo "Test run may have failed before generating coverage data." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Generate coverage function details
      if: always()
      continue-on-error: true
      run: |
        if [ -f /tmp/sprout-coverage.out ]; then
          go tool cover -func=/tmp/sprout-coverage.out > /tmp/sprout-coverage-func.txt
          echo "Generated coverage function details"
        else
          echo "Coverage file not found, skipping coverage function details generation"
        fi

    - name: Upload coverage report
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: /tmp/sprout-coverage.out
        retention-days: 30

    - name: Upload coverage function details
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: coverage-function-details
        path: /tmp/sprout-coverage-func.txt
        retention-days: 30

    - name: Upload test logs
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: /tmp/sprout-test-coverage.log
        retention-days: 30

    - name: Run smoke tests
      run: make test-smoke

  # Windows test lane — same suite as `test`, running OUT OF the release
  # critical path. Its instrumented coverage run took 41 min on
  # windows-latest (3x ubuntu) and gated every push; here it runs beside
  # `test` and the `build` matrix instead of ahead of them, so the
  # release wall clock follows ubuntu/macos (~20 min) instead of Windows
  # (~50 min). Failures still surface on the PR/push — they just don't
  # hold binaries hostage. Kept in the same required-check style: the
  # job must succeed for the run to be green.
  test-windows:
    name: Run Tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        # Full history so golangci-lint's only-new-issues diff is accurate.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        else
          pip install requests pytest
        fi

    - name: Install dependencies
      run: go mod download

    - name: Run go vet
      run: make vet

    - name: Check gofmt
      run: make fmt-check

    - name: Lint Go (new code only)
      # Same new-code gate as the `test` job — see the note there.
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.5.0
        only-new-issues: true

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install Node.js dependencies (root workspaces)
      run: npm ci

    - name: Build shared workspace packages
      run: |
        npm run build -w @sprout/events
        npm run build -w @sprout/ui

    - name: Run full build pipeline (make build-all)
      run: make build-all

    - name: Run unit tests with coverage
      # STATUS_DLL_INIT_FAILED teardown crash — see the note in the `test`
      # job. continue-on-error until that is root-caused; failures still
      # show in the job log.
      continue-on-error: true
      env:
        CI: "true"
        TEST_P: "1"
        TEST_PARALLEL: "2"
        TEST_RACE: ""
        TEST_COVER: "no"
      run: make test-coverage

    - name: Run smoke tests
      run: make test-smoke

  # WASM tool roster smoke test — runs once on Linux regardless of
  # the test job's matrix. The script cross-compiles the WASM target
  # and asserts the SP-112-6/8 excluded tools stay excluded; it
  # doesn't need to run on macOS/Windows because the build output
  # is OS-agnostic (it's a list of .go file inclusion decisions).
  wasm-smoke:
    name: WASM tool roster smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26

    - name: Prepare grammar blobs
      # The WASM build embeds grammar .bin files (pkg/ast/grammars/bin/*.bin)
      # via //go:embed. These are gitignored and regenerated by
      # prepare-grammars — without this step the embed pattern finds no files.
      run: make prepare-grammars

    - name: Run WASM tool roster smoke test
      shell: bash
      run: bash scripts/wasm-tool-roster-smoke.sh

  build:
    name: Build Binaries
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26

    - name: Install dependencies
      run: go mod download

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install Node.js dependencies (root workspaces)
      # Single `npm ci` from root installs every workspace
      # (packages/events, packages/ui, webui) plus root devDeps.
      # Per-workspace `npm install` in the past pruned root devDeps.
      run: npm ci

    - name: Build shared workspace packages
      # webui imports @sprout/events and @sprout/ui from their `dist/`
      # outputs (no `prepare` script — removed in 61ba3f17).
      run: |
        npm run build -w @sprout/events
        npm run build -w @sprout/ui

    - name: Build UI and WASM assets (make deploy-ui build-wasm)
      shell: bash
      run: make deploy-ui build-wasm

    - name: Set build variables
      id: set_vars
      shell: bash
      run: |
        OS_NAME=""
        EXT=""
        BUILD_TAGS="browser"
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          OS_NAME="windows"
          EXT=".exe"
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          OS_NAME="darwin"
        else
          OS_NAME="linux"
        fi
        # MLX C library is only available on macOS arm64 (Apple Silicon runners)
        if [[ "${{ matrix.os }}" == "macos-latest" && "${{ matrix.arch }}" == "arm64" ]]; then
          brew install mlx-c
          BUILD_TAGS="browser mlx"
        fi
        echo "os_name=${OS_NAME}" >> $GITHUB_OUTPUT
        echo "ext=${EXT}" >> $GITHUB_OUTPUT
        echo "build_tags=${BUILD_TAGS}" >> $GITHUB_OUTPUT
        echo "binary_name=sprout-${OS_NAME}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

    - name: Build
      env:
        GOOS: ${{ steps.set_vars.outputs.os_name }}
        GOARCH: ${{ matrix.arch }}
      run: go build -tags "${{ steps.set_vars.outputs.build_tags }}" -o ${{ steps.set_vars.outputs.binary_name }}${{ steps.set_vars.outputs.ext }} .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.set_vars.outputs.binary_name }}
        path: ${{ steps.set_vars.outputs.binary_name }}${{ steps.set_vars.outputs.ext }}
