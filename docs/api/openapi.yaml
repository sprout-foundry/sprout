# Sprout backend contract (OpenAPI 3.1).
#
# This is the versioned, machine-readable description of the HTTP API the
# spaces talk to. It is the single source of truth for the contract version:
# `info.version` is reported by `/api/bootstrap` and compared by clients to
# detect incompatible major-version drift. Bump it deliberately.
#
# Path entries with request/response schemas are added family by family; the
# `tags` below name those families (matching the grouping in
# docs/api/endpoints.md). The conversation family (query lifecycle, chat and
# saved sessions, subagents, edit and shell approvals, and completions) is
# documented here. Routes not yet documented are tracked in
# docs/api/undocumented.txt and a Go test in pkg/webui keeps the two in
# lockstep: a route is removed from the allowlist in the same change that
# documents its path below.
#
# Prefix routes registered with a trailing "/" (such as /api/edits/) keep
# that exact mux pattern as their OpenAPI path key so the contract test's
# literal route match holds; the dynamic sub-segment(s) they stand for are
# described in the operation description.
openapi: 3.1.0
info:
  title: Sprout backend contract
  description: >-
    HTTP API that Sprout's spaces call against a host. Versioned by
    info.version and checked by the conformance suite (docs/api). Path
    entries are added per family; see the tags below and
    docs/api/undocumented.txt for routes still being documented.
  version: 1.0.0
tags:
  - name: conversation/query
    description: Query lifecycle, steering, command execution, and completions.
  - name: files
    description: File browsing, reads/writes, create/delete/rename, and edits.
  - name: git
    description: Git status, history, diffs, commits, branches, and worktrees.
  - name: settings
    description: Settings, providers, onboarding, hotkeys, skills, and config.
  - name: terminal
    description: Terminal, agent-session, and language-server (LSP) surfaces.
  - name: workspace/instances
    description: Workspace metadata and remote instance/SSH management.
  - name: sync/txn
    description: File sync operations and container-side git transactions.
  - name: sessions
    description: Chat sessions and worktree session mappings.
  - name: search
    description: Search and search-and-replace across files.
  - name: diagnostics
    description: Diagnostics, semantic analysis, stats, and support bundles.
  - name: design
    description: Design-tree status and signals.
  - name: starters
    description: Starter project catalogue and instantiation.
  - name: misc/static
    description: Bootstrap, static assets, and other non-family routes.
paths:
  /api/query:
    post:
      tags: [conversation/query]
      summary: Start a query in a chat session.
      description: >-
        Starts an agent query for a chat session. The query runs
        asynchronously; progress and completion are delivered over the
        WebSocket. When the body omits `chat_id`, the client's active chat is
        used.
      operationId: queryStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "202":
          description: The query was accepted and is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryAcceptedResponse"
        "400":
          description: Malformed body, missing query text, or an unsafe command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The client context was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A query is already running for this chat or workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No AI provider is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/query/steer:
    post:
      tags: [conversation/query]
      summary: Steer a running query.
      description: >-
        Injects input into the currently running query, or executes a safe
        slash command mid-turn. When the body omits `chat_id`, the client's
        active chat is used.
      operationId: querySteer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuerySteerRequest"
      responses:
        "200":
          description: A safe slash command was executed mid-turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SteerCommandResponse"
        "202":
          description: The steer input was accepted into the active query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SteerAcceptedResponse"
        "400":
          description: Malformed body, missing query, or a non-steerable slash command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No active query to steer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No AI provider is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/query/steer/retract:
    post:
      tags: [conversation/query]
      summary: Retract the newest staged steer.
      description: >-
        Pulls back the newest staged-but-unpicked steer message so the user
        can edit it. When the body omits `chat_id`, the client's active chat is
        used. Returns success=false (not an error) when nothing is pending.
      operationId: querySteerRetract
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: string
                  description: Target chat session; falls back to the client's active chat.
      responses:
        "200":
          description: The newest staged steer was retracted, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SteerRetractResponse"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No AI provider is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/query/stop:
    post:
      tags: [conversation/query]
      summary: Stop the active query.
      description: >-
        Interrupts the currently running query and cancels its active
        subagents. Returns 200 with already_completed=true when nothing was
        running. When the URL omits `chat_id`, the client's active chat is
        used.
      operationId: queryStop
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: No query was running for the chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStopAlreadyCompleted"
        "202":
          description: The active query was interrupted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStopAccepted"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No AI provider is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/query/status:
    get:
      tags: [conversation/query]
      summary: Poll whether a query is active.
      description: >-
        Reports whether a query is currently active for a chat. This is the
        polling fallback for when the WebSocket drops and reconnects.
      operationId: queryStatus
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: The active-query status for the chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStatusResponse"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/query/rewind:
    post:
      tags: [conversation/query]
      summary: Rewind the conversation to a prior turn.
      description: >-
        Truncates the conversation history back to before the given turn and,
        by default, reverts the file changes made during the discarded turns.
        When the body omits `chat_id`, the client's active chat is used.
      operationId: queryRewind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRewindRequest"
      responses:
        "200":
          description: The conversation was rewound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryRewindResponse"
        "400":
          description: Missing to_turn, an unknown client context, or a rewind failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A query is currently running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No AI provider is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions:
    get:
      tags: [conversation/query]
      summary: List the client's chat sessions.
      operationId: chatSessionsList
      responses:
        "200":
          description: The client's chat sessions, most recently active first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionsListResponse"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/create:
    post:
      tags: [conversation/query]
      summary: Create a chat session.
      operationId: chatSessionsCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionCreateRequest"
      responses:
        "200":
          description: The chat session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionCreateResponse"
        "403":
          description: Multi-chat is disabled in shared mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A session with this ID already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/create-in-worktree:
    post:
      tags: [conversation/query]
      summary: Create a chat session in a new git worktree.
      operationId: chatSessionsCreateInWorktree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionCreateInWorktreeRequest"
      responses:
        "200":
          description: The session and its worktree were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionCreateInWorktreeResponse"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The worktree path or a session with this ID already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/delete:
    post:
      tags: [conversation/query]
      summary: Delete a chat session.
      operationId: chatSessionsDelete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionDeleteRequest"
      responses:
        "200":
          description: The chat session was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionDeleteResponse"
        "400":
          description: Missing ID, or the session is the default, the active one, or has an active query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Multi-chat is disabled in shared mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/delete-all:
    post:
      tags: [conversation/query]
      summary: Delete all non-default chat sessions.
      operationId: chatSessionsDeleteAll
      responses:
        "200":
          description: All non-default sessions were deleted and the default is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionsDeleteAllResponse"
        "403":
          description: Multi-chat is disabled in shared mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/rename:
    post:
      tags: [conversation/query]
      summary: Rename a chat session.
      operationId: chatSessionsRename
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionRenameRequest"
      responses:
        "200":
          description: The chat session was renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionRenameResponse"
        "400":
          description: Missing ID or name, or the session was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/pin:
    post:
      tags: [conversation/query]
      summary: Pin a chat session.
      operationId: chatSessionsPin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionIdRequest"
      responses:
        "200":
          description: The chat session was pinned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionPinResponse"
        "400":
          description: Missing ID, or the session was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The client context was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/unpin:
    post:
      tags: [conversation/query]
      summary: Unpin a chat session.
      operationId: chatSessionsUnpin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionIdRequest"
      responses:
        "200":
          description: The chat session was unpinned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionPinResponse"
        "400":
          description: Missing ID, or the session was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The client context was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/switch:
    post:
      tags: [conversation/query]
      summary: Switch the active chat session.
      operationId: chatSessionsSwitch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionSwitchRequest"
      responses:
        "200":
          description: The active chat was switched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionSwitchResponse"
        "400":
          description: Missing ID, or the session was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Multi-chat is disabled in shared mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The target session belongs to a different lane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/messages:
    get:
      tags: [conversation/query]
      summary: Fetch a chat session's messages.
      description: >-
        Read-only fetch of a chat session's transcript. Unlike the switch
        endpoint this does not change the client's active chat, so a background
        pane can refresh without disturbing the active chat.
      operationId: chatSessionMessages
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: The chat session with its messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionMessagesResponse"
        "400":
          description: The chat session was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/compact:
    post:
      tags: [conversation/query]
      summary: Compact a chat session's state.
      operationId: chatSessionsCompact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionIdRequest"
      responses:
        "200":
          description: The chat session state was compacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionCompactResponse"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to sync the chat state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/history:
    post:
      tags: [conversation/query]
      summary: Clear a chat session's history.
      description: >-
        Clears the conversation messages for a chat session while keeping the
        session and its configuration overrides intact. The prior session is
        preserved as a restorable unit.
      operationId: chatSessionClearHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionIdRequest"
      responses:
        "200":
          description: A new session was started for the chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionClearHistoryResponse"
        "404":
          description: The client context or chat session was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to rotate the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/fork:
    post:
      tags: [conversation/query]
      summary: Fork a chat session at a breakpoint.
      description: >-
        Forks the conversation at the given user-message breakpoint (1-based),
        saving the current session and creating a new one from the truncated
        history. When the body omits `chat_id`, the client's active chat is
        used.
      operationId: chatSessionFork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionForkRequest"
      responses:
        "200":
          description: The session was forked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionForkResponse"
        "400":
          description: The breakpoint index was invalid, or the fork failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The chat agent was not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/breakpoints:
    post:
      tags: [conversation/query]
      summary: List a chat session's forkable breakpoints.
      description: >-
        Returns the forkable breakpoints (user messages) for a chat session.
        When the body omits `chat_id`, the client's active chat is used.
      operationId: chatSessionBreakpoints
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatIdRequest"
      responses:
        "200":
          description: The forkable breakpoints for the chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionBreakpointsResponse"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The chat agent was not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chat-sessions/worktree-mappings:
    get:
      tags: [conversation/query]
      summary: List chat sessions with worktree mappings.
      operationId: chatSessionWorktreeList
      responses:
        "200":
          description: The chat sessions that have a worktree path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionWorktreeMappingsResponse"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/chat-session/":
    get:
      tags: [conversation/query]
      summary: Get a chat session's worktree path.
      description: >-
        Prefix route: the sub-segment(s) after /api/chat-session/ are
        dynamic; the documented shape is /api/chat-session/{chatId}/worktree.
        The GET reads the chat's worktree path.
      operationId: chatSessionWorktreeGet
      parameters:
        - name: chatId
          in: path
          required: true
          description: The dynamic sub-segment(s); the documented shape is {chatId}/worktree.
          schema:
            type: string
      responses:
        "200":
          description: The chat's worktree path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionWorktreeResponse"
        "400":
          description: Invalid route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Only GET and POST are accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [conversation/query]
      summary: Set a chat session's worktree path.
      description: >-
        Sets (or clears) the worktree path for a chat session at
        /api/chat-session/{chatId}/worktree. See the GET operation for the
        dynamic sub-segment shape.
      operationId: chatSessionWorktreeSet
      parameters:
        - name: chatId
          in: path
          required: true
          description: The dynamic sub-segment(s); the documented shape is {chatId}/worktree.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionWorktreeSetRequest"
      responses:
        "200":
          description: The worktree path was set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionWorktreeResponse"
        "400":
          description: Invalid route, worktree path, or a failed workspace switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Only GET and POST are accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions:
    get:
      tags: [conversation/query]
      summary: List saved sessions.
      operationId: sessionsList
      parameters:
        - name: scope
          in: query
          required: false
          description: Sessions for the current workspace (current, the default) or across all workspaces (all).
          schema:
            type: string
            default: current
            enum: [current, all]
      responses:
        "200":
          description: The saved sessions, capped at the most recent 100.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsListResponse"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to list sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/restore:
    post:
      tags: [conversation/query]
      summary: Restore a saved session.
      description: >-
        Restores a saved session into a chat. When `chat_id` is omitted the
        restore targets the client's active chat.
      operationId: sessionRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRestoreRequest"
      responses:
        "200":
          description: The session was restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRestoreResponse"
        "400":
          description: Missing session ID, or the session could not be loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/search:
    get:
      tags: [conversation/query]
      summary: Search across saved sessions.
      operationId: sessionsSearch
      parameters:
        - name: q
          in: query
          required: true
          description: The search query string.
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - name: cwd
          in: query
          required: false
          description: Restrict to sessions in this working directory.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Only sessions last updated on or after this date (RFC3339 or YYYY-MM-DD).
          schema:
            type: string
        - name: until
          in: query
          required: false
          description: Only sessions last updated on or before this date (RFC3339 or YYYY-MM-DD).
          schema:
            type: string
        - name: reindex
          in: query
          required: false
          description: Force a full index rebuild when "true" or "1".
          schema:
            type: string
      responses:
        "200":
          description: The matching sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsSearchResponse"
        "400":
          description: Missing query, or an invalid date or limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to build or search the index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/{id}/export:
    get:
      tags: [conversation/query]
      summary: Export a saved session to a downloadable file.
      operationId: sessionExport
      parameters:
        - name: id
          in: path
          required: true
          description: The saved session ID to export.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: The export format.
          schema:
            type: string
            default: markdown
            enum: [markdown, html, json]
        - name: include_tool_calls
          in: query
          required: false
          description: Include tool calls when "true" (default false).
          schema:
            type: string
        - name: include_cost
          in: query
          required: false
          description: Include cost when not "false" (default true).
          schema:
            type: string
        - name: no_secret_redaction
          in: query
          required: false
          description: Skip secret redaction when "true" (default false).
          schema:
            type: string
        - name: cwd
          in: query
          required: false
          description: Resolve the session within this working directory.
          schema:
            type: string
      responses:
        "200":
          description: The exported session, with a Content-Disposition attachment header.
          content:
            text/markdown:
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
        "400":
          description: Invalid format, or a missing session ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The session was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to load or export the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/subagent/":
    post:
      tags: [conversation/query]
      summary: Cancel a running subagent.
      description: >-
        Prefix route: the sub-segment(s) after /api/subagent/ are dynamic; the
        documented shape is /api/subagent/{id}/cancel. Cancels one running
        subagent in the active chat. Idempotent: when the ID is not currently
        running it returns a 200 already_completed payload so the UI can clean
        up its row.
      operationId: subagentCancel
      parameters:
        - name: id
          in: path
          required: true
          description: The dynamic sub-segment(s); the documented shape is {id}/cancel.
          schema:
            type: string
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: The subagent was already done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentCancelResponse"
        "202":
          description: The subagent was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentCancelResponse"
        "404":
          description: No subagent runner for this chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No AI provider is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/edits/":
    get:
      tags: [conversation/query]
      summary: Get a pending edit proposal's status.
      description: >-
        Prefix route: the sub-segment(s) after /api/edits/ are dynamic. The
        documented shape is /api/edits/{id}, whose GET returns the state of a
        pending edit proposal.
      operationId: editStatus
      parameters:
        - name: id
          in: path
          required: true
          description: The dynamic sub-segment(s); the documented shape is {id}.
          schema:
            type: string
      responses:
        "200":
          description: The pending edit proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditStatusResponse"
        "404":
          description: The edit was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Only GET and POST are accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [conversation/query]
      summary: Submit a per-hunk edit decision.
      description: >-
        Submits the user's per-hunk accept/reject choices for a pending edit at
        /api/edits/{id}/decision, unblocking the agent's edit-approval broker.
      operationId: editDecision
      parameters:
        - name: id
          in: path
          required: true
          description: The dynamic sub-segment(s); the documented shape is {id}/decision.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditDecisionRequest"
      responses:
        "200":
          description: The decision was delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditDecisionResponse"
        "404":
          description: The edit was not found or already decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The edit was already decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Only GET and POST are accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/shell-approvals/":
    post:
      tags: [conversation/query]
      summary: Submit a per-part shell approval decision.
      description: >-
        Prefix route: the sub-segment(s) after /api/shell-approvals/ are
        dynamic; the documented shape is /api/shell-approvals/{id}/decision.
        Submits per-part accept/reject choices for a pending shell approval,
        unblocking the agent's shell-approval broker.
      operationId: shellApprovalDecision
      parameters:
        - name: id
          in: path
          required: true
          description: The dynamic sub-segment(s); the documented shape is {id}/decision.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShellApprovalDecisionRequest"
      responses:
        "200":
          description: The decision was delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShellApprovalDecisionResponse"
        "400":
          description: Missing request ID, or the decisions map is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The request ID is unknown or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No agent is available to receive the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/completion:
    post:
      tags: [conversation/query]
      summary: Generate a code completion.
      operationId: completionGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: The generated completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"
        "400":
          description: Malformed body, or a missing prefix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to resolve the provider or generate the completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The agent or its configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/browse:
    get:
      tags: [files]
      summary: List a directory's contents.
      description: >-
        Lists the files and directories inside a path, always skipping the .git
        directory. When `path` is omitted the workspace root is listed. Set
        `ignore=true` to also filter out entries matched by the workspace's
        gitignore rules.
      operationId: browse
      parameters:
        - name: path
          in: query
          required: false
          description: The directory to list, relative to the workspace root; defaults to the root.
          schema:
            type: string
        - name: ignore
          in: query
          required: false
          description: Filter out entries matched by gitignore rules when "true".
          schema:
            type: string
            default: "false"
      responses:
        "200":
          description: The directory listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseResponse"
        "400":
          description: The directory path is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The directory is outside the workspace, or the home-workspace gate was not consented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The directory could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/create:
    post:
      tags: [files]
      summary: Create a file or directory.
      description: >-
        Creates a file or a directory at `path` (or `directory`, which is an
        interchangeable alias). A trailing slash on the path, or a non-empty
        `directory`, makes it a directory. Fails with 409 when the target
        already exists.
      operationId: createFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileCreateRequest"
      responses:
        "200":
          description: The file or directory was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileCreateResponse"
        "400":
          description: Malformed body, neither path nor directory given, or an invalid path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The path is outside the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The target path already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The file or directory could not be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/delete:
    post:
      tags: [files]
      summary: Delete a file or directory.
      description: >-
        Recursively deletes the file or directory at `path`. Both POST and
        DELETE are accepted; POST is the browser-friendly form.
      operationId: deleteItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileDeleteRequest"
      responses:
        "200":
          description: The item was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDeleteResponse"
        "400":
          description: Malformed body, missing path, or an invalid path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The path is outside the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST or DELETE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The item could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [files]
      summary: Delete a file or directory (HTTP DELETE).
      description: The HTTP-DELETE form of the delete operation; same semantics as POST.
      operationId: deleteItemHttp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileDeleteRequest"
      responses:
        "200":
          description: The item was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDeleteResponse"
        "400":
          description: Malformed body, missing path, or an invalid path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The path is outside the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST or DELETE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The item could not be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/file:
    get:
      tags: [files]
      summary: Read a file's contents.
      description: >-
        Reads and returns the raw content of the file at the `path` query
        parameter, with a detected Content-Type. Serves a conditional 304 when
        the `If-Modified-Since` header matches the file's mtime. External paths
        (outside the workspace and app-config directory) require an
        unconsumed file-consent token.
      operationId: fileRead
      parameters:
        - name: path
          in: query
          required: true
          description: The file to read, relative to the workspace root.
          schema:
            type: string
        - name: consent_token
          in: query
          required: false
          description: A file-consent token for an external (non-workspace) path.
          schema:
            type: string
      responses:
        "200":
          description: The file's content, with a detected MIME type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified; the client's copy is current.
        "400":
          description: Missing path, an invalid path, or the path is a directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The external path requires an unconsumed file-consent token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The file does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is too large to open in the editor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileTooLargeResponse"
        "405":
          description: The route only accepts GET or POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The file could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [files]
      summary: Write a file's contents.
      description: >-
        Writes `content` to the file at the `path` query parameter, creating
        parent directories as needed. When `baseMtime` or `baseHash` is
        supplied the write is conditional on the file still being at the
        revision the caller last read; a mismatch returns 409 with the current
        revision and writes nothing. External paths require an unconsumed
        file-consent token.
      operationId: fileWrite
      parameters:
        - name: path
          in: query
          required: true
          description: The file to write, relative to the workspace root.
          schema:
            type: string
        - name: consent_token
          in: query
          required: false
          description: A file-consent token for an external (non-workspace) path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileWriteRequest"
      responses:
        "200":
          description: The file was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileWriteResponse"
        "400":
          description: Missing path, an invalid path, or a malformed or oversized body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The external path requires an unconsumed file-consent token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The base-revision guard failed; nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileWriteConflictResponse"
        "405":
          description: The route only accepts GET or POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The file could not be written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/file/check-modified:
    post:
      tags: [files]
      summary: Report files that changed on disk.
      description: >-
        For each path in `files` (mapped to its last-known mtime in unix
        seconds), reports the files whose on-disk mtime or size has since
        changed, or that are now inaccessible. Also registers each existing
        file with the file watcher so changes can be pushed in real time.
      operationId: fileCheckModified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileCheckModifiedRequest"
      responses:
        "200":
          description: The files that changed on disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileCheckModifiedResponse"
        "400":
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/file/consent:
    post:
      tags: [files]
      summary: Issue a file-consent token for an external path.
      description: >-
        Mints a short-lived consent token that authorizes a read or write of a
        file outside the workspace and the app-config directory. Paths that
        are already within the workspace (or the app-config directory) need no
        consent and are rejected with 400.
      operationId: fileConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileConsentRequest"
      responses:
        "200":
          description: The consent token and its expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileConsentResponse"
        "400":
          description: Malformed body, an invalid operation or path, or a path that needs no external consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The consent token could not be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/files:
    get:
      tags: [files]
      summary: List a directory with git status.
      description: >-
        Lists the entries of a directory, computing per-entry git status
        (modified, untracked, ignored) unless `git_status=false` is set for a
        faster, status-free listing. Defaults to the workspace root when
        `path` (or `dir`) is omitted.
      operationId: filesList
      parameters:
        - name: path
          in: query
          required: false
          description: The directory to list, relative to the workspace root; defaults to the root.
          schema:
            type: string
        - name: dir
          in: query
          required: false
          description: An alias for `path`.
          schema:
            type: string
        - name: git_status
          in: query
          required: false
          description: Set to "false" to skip git-status computation.
          schema:
            type: string
            default: "true"
      responses:
        "200":
          description: The directory listing with git status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesListResponse"
        "400":
          description: The directory path is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The directory is outside the workspace, or the home-workspace gate was not consented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The directory could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/files/prettier-config:
    get:
      tags: [files]
      summary: Discover the workspace's Prettier configuration.
      description: >-
        Merges the Prettier configuration found in the workspace (the
        .prettierrc family of files and the `prettier` key in package.json)
        into a single object, with later sources overriding earlier ones. Only
        the formats the Go backend can parse are read; JS and TOML config
        files are intentionally skipped.
      operationId: prettierConfig
      responses:
        "200":
          description: The merged Prettier configuration (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrettierConfig"
        "400":
          description: No workspace is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/rename:
    post:
      tags: [files]
      summary: Rename or move a file or directory.
      description: >-
        Renames (or moves) the item at `old_path` to `new_path`, creating the
        target's parent directory as needed. Fails with 404 when the source is
        missing and 409 when the target already exists.
      operationId: renameItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileRenameRequest"
      responses:
        "200":
          description: The item was renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRenameResponse"
        "400":
          description: Malformed body, missing paths, or an invalid path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A path is outside the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The source path does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The target path already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The rename failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/search:
    get:
      tags: [search]
      summary: Search for matches across workspace files.
      description: >-
        Searches the workspace files for matches of `query`, returning the
        matched lines with surrounding context. The search is bounded by a
        timeout and by a file-walk and match cap; when any cap is hit the
        result is marked truncated.
      operationId: searchQuery
      parameters:
        - name: query
          in: query
          required: true
          description: The text (or regex, when `regex=true`) to search for.
          schema:
            type: string
        - name: case_sensitive
          in: query
          required: false
          description: Match case exactly when "true".
          schema:
            type: string
            default: "false"
        - name: whole_word
          in: query
          required: false
          description: Match whole words when "true".
          schema:
            type: string
            default: "false"
        - name: regex
          in: query
          required: false
          description: Treat `query` as a regular expression when "true".
          schema:
            type: string
            default: "false"
        - name: max_results
          in: query
          required: false
          description: Maximum number of matches; when omitted the default is 500, capped at 5000.
          schema:
            type: string
        - name: context_lines
          in: query
          required: false
          description: Number of context lines before and after a match; when omitted the default is 2.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: Comma-separated path patterns to include.
          schema:
            type: string
        - name: exclude
          in: query
          required: false
          description: Comma-separated path patterns to exclude.
          schema:
            type: string
      responses:
        "200":
          description: The matches, grouped by file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Missing query, or a query that is too long.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "408":
          description: The search timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The search failed (for example an invalid regex).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/search/replace:
    post:
      tags: [search]
      summary: Search and replace across files.
      description: >-
        Replaces matches of `search` with `replace` within the listed
        `files`, honoring the same case/whole-word/regex modifiers as the
        search. When `preview` is true the changes are computed but not
        written. Files are restricted to the workspace.
      operationId: searchReplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRequest"
      responses:
        "200":
          description: The changes applied (or previewed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaceResponse"
        "400":
          description: Malformed body, a missing or oversized pattern, a file outside the workspace, or an invalid search pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The replacement failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/upload/image:
    post:
      tags: [files]
      summary: Upload an image for use in a chat.
      description: >-
        Accepts an image either as a raw body or as a multipart form field
        named `image`. The image format is validated by magic bytes and the
        file is saved into the workspace; the response returns the absolute
        path and filename so the client can reference it in a message.
      operationId: uploadImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image to upload (form field `image`).
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: The raw image bytes.
      responses:
        "200":
          description: The image was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResponse"
        "400":
          description: The body could not be read, or is not a recognized image format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The image could not be saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/diagnostics:
    post:
      tags: [diagnostics]
      summary: Validate Go source content.
      description: >-
        Runs Go validation (syntax and import checks) over `content` for the
        file at `path` and returns diagnostics with byte-offset positions
        compatible with Monaco editors. When no agent or validator is
        available, an empty diagnostics list is returned.
      operationId: diagnosticsValidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticsRequest"
      responses:
        "200":
          description: The diagnostics for the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsResponse"
        "400":
          description: Malformed body, a missing path, or an invalid path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The path is outside the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/semantic:
    post:
      tags: [diagnostics]
      summary: Run a semantic analysis method on a file.
      description: >-
        Runs one language-semantic method (diagnostics, definition, hover,
        rename, references, code_actions, inlay_hints, or signature_help) for
        the file at `path` in `language_id`, dispatched to the matching
        language-server adapter. The position-dependent methods (definition,
        hover, rename, references, code_actions, signature_help) require
        `position`. An unknown language returns an empty capabilities set.
      operationId: semanticRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticRequest"
      responses:
        "200":
          description: The semantic result for the requested method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticResponse"
        "400":
          description: Malformed body, a missing path, an invalid method, a missing position, or an invalid path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The path is outside the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/lsp/status:
    get:
      tags: [terminal]
      summary: Report available and active LSP servers.
      description: >-
        Lists the configured language servers with their supported languages,
        binary, install hint, and whether the binary is resolvable on PATH,
        plus the count of currently active LSP sessions and the workspace
        root.
      operationId: lspStatus
      responses:
        "200":
          description: The LSP server status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LSPStatusResponse"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/lsp/ws:
    get:
      tags: [terminal]
      summary: Open an LSP WebSocket bridge.
      description: >-
        Upgrades the request to a WebSocket (101 Switching Protocols) and
        bridges it to the language-server process for the `language` in the
        `workspace`. Raw LSP messages then flow over the frame channel; there
        is no JSON request/response body. Both `language` and `workspace` are
        required.
      operationId: lspWebSocket
      parameters:
        - name: language
          in: query
          required: true
          description: The language ID for the language server to bridge.
          schema:
            type: string
        - name: workspace
          in: query
          required: true
          description: The workspace path the language server serves.
          schema:
            type: string
      responses:
        "101":
          description: The connection was upgraded to a WebSocket; LSP messages flow over the frame channel.
        "400":
          description: The `language` or `workspace` query parameter is missing.
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: The workspace path is not allowed.
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: The language server could not be started.
          content:
            text/plain:
              schema:
                type: string
  /api/git/status:
    get:
      tags: [git]
      summary: Report the workspace's git status.
      description: >-
        Returns the current branch, ahead/behind tracking, and the staged,
        modified, untracked, deleted, and renamed file lists for the active
        workspace. When the workspace is not a git repository the response
        reports `in_git_repo: false` and empty lists rather than an error.
      operationId: gitStatus
      responses:
        "200":
          description: The git status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatusResponse"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The git status could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/diff:
    get:
      tags: [git]
      summary: Return the staged and unstaged diff for a file.
      description: >-
        Returns the staged and unstaged diff for the file at the `path` query
        parameter, plus a combined diff and the full before/after file contents
        used by the editable merge view. When the workspace is not a git
        repository the diffs come back empty and the contents are unavailable.
      operationId: gitDiff
      parameters:
        - name: path
          in: query
          required: true
          description: The file to diff, relative to the workspace root.
          schema:
            type: string
      responses:
        "200":
          description: The staged, unstaged, and combined diffs for the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitDiffResponse"
        "400":
          description: The `path` query parameter is missing or empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: A diff could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/log:
    get:
      tags: [git]
      summary: List recent commits, paginated.
      description: >-
        Returns a page of commit entries (hash, author, date, subject, and
        branch/HEAD refs) plus the page's `offset`, `limit`, and the total
        commit count. The `limit` defaults to 30 and is capped at 100; the
        `offset` defaults to 0. Returns an error when the workspace is not a
        git repository.
      operationId: gitLog
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: The page of commits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLogResponse"
        "400":
          description: The workspace is not a git repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The git log could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/branches:
    get:
      tags: [git]
      summary: List local and remote branches.
      description: >-
        Returns the current branch plus the combined, local, and remote branch
        lists for the active workspace. Remote symrefs such as `origin/HEAD`
        are skipped. When the workspace is not a git repository the lists come
        back empty and `message` is `not_git_repo` rather than an error.
      operationId: gitBranches
      responses:
        "200":
          description: The current and available branches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitBranchesResponse"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: A branch list could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/worktrees:
    get:
      tags: [git]
      summary: List git worktrees.
      description: >-
        Returns the set of worktrees in the repository with each worktree's
        path, branch, whether it is the main worktree, whether it is the
        active workspace, and its parent worktree's path and branch. When the
        workspace is not a git repository the list comes back empty and
        `message` is `not_git_repo` rather than an error.
      operationId: gitWorktrees
      responses:
        "200":
          description: The worktrees in the repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitWorktreesResponse"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The worktree list could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/deep-review/fix/status:
    get:
      tags: [git]
      summary: Poll the status and logs of a running deep-review fix job.
      description: >-
        Returns incremental status and log lines for a running deep-review fix
        job, identified by `job_id`. The `since` parameter (a log index)
        requests only the log lines after that index; the response's
        `next_index` is the next value to pass as `since` to continue polling.
        Only the client that started the job can query it; other clients are
        told the job is not found.
      operationId: gitDeepReviewFixStatus
      parameters:
        - name: job_id
          in: query
          required: true
          description: The fix-job ID to poll.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: The log index to resume from; the response returns only the lines after it.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: The job's current status, incremental logs, and result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitDeepReviewFixStatusResponse"
        "400":
          description: The `job_id` query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The job is unknown, or it belongs to a different client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/commit/show:
    get:
      tags: [git]
      summary: Show a commit's metadata, diff, and file list.
      description: >-
        Returns the full hash, short hash, author, date, refs, and subject of
        the commit at the `hash` query parameter, along with its unified diff,
        a diff-tree file list, and a stat summary. This daemon endpoint is a
        GET; the in-browser browser-git path lists the same operation as a
        POST in the web UI's cloud endpoint registry, but the daemon handler
        itself requires GET.
      operationId: gitCommitShow
      parameters:
        - name: hash
          in: query
          required: true
          description: The commit hash to show.
          schema:
            type: string
      responses:
        "200":
          description: The commit's metadata, diff, files, and stat summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitCommitShowResponse"
        "400":
          description: The `hash` is missing, invalid, or does not name a commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The commit's metadata, diff, or file list could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/commit/show/file:
    get:
      tags: [git]
      summary: Show the diff of a single file within a commit.
      description: >-
        Returns the unified diff for the file at `path` within the commit at
        `hash`, plus the full before/after contents used by the read-only
        merge view. Both `hash` and `path` are required. This daemon endpoint
        is a GET; the in-browser browser-git path lists the same operation as
        a POST in the web UI's cloud endpoint registry, but the daemon
        handler itself requires GET.
      operationId: gitCommitFileDiff
      parameters:
        - name: hash
          in: query
          required: true
          description: The commit hash to inspect.
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: The file to diff within the commit, relative to the workspace root.
          schema:
            type: string
      responses:
        "200":
          description: The single-file diff and before/after contents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitCommitFileDiffResponse"
        "400":
          description: The `hash` or `path` is missing, the hash is not a commit, or the path is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The file is not present in the commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The commit's file diff could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/branch/create:
    post:
      tags: [git]
      summary: Create a new branch and check it out.
      description: >-
        Validates the branch name with git check-ref-format and then runs
        git checkout -b to create and switch to the new branch. The branch
        name is validated as a valid ref before the checkout is attempted.
      operationId: gitBranchCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitBranchCreateRequest"
      responses:
        "200":
          description: The branch was created and checked out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitBranchCreateResponse"
        "400":
          description: Invalid JSON, a missing branch name, or an invalid branch name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The branch could not be created or checked out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/checkout:
    post:
      tags: [git]
      summary: Switch to an existing branch.
      description: >-
        Checks out the named branch in the active workspace. The branch name
        must be non-empty and must not start with a hyphen.
      operationId: gitCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitBranchSwitchRequest"
      responses:
        "200":
          description: The branch was checked out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitBranchSwitchResponse"
        "400":
          description: Invalid JSON, a missing branch name, or an invalid branch name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The branch could not be checked out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/commit:
    post:
      tags: [git]
      summary: Commit the currently staged changes.
      description: >-
        Creates a commit from the staged changes using the provided message.
        Fails when there are no staged changes. The response echoes the git
        commit output.
      operationId: gitCommit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitCommitRequest"
      responses:
        "200":
          description: The commit was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitCommitCreateResponse"
        "400":
          description: Invalid JSON, a missing commit message, or no staged changes to commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The commit could not be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/commit-message:
    post:
      tags: [git]
      summary: Generate an AI commit message from the staged changes.
      description: >-
        Generates a commit message for the currently staged changes without
        creating a commit. Requires a staged diff and at least one staged
        file change; the configured provider and model are used. Takes no
        request body.
      operationId: gitCommitMessage
      responses:
        "200":
          description: The generated commit message and the model that produced it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitCommitMessageResponse"
        "400":
          description: No staged changes to generate a message from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The staged diff could not be read, the provider could not be resolved, or generation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No AI agent or its configuration is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/confirm:
    post:
      tags: [git]
      summary: Respond to a pending security approval or prompt.
      description: >-
        Records the user's response to a pending security approval or file
        security prompt, identified by request_id. The optional action
        carries the multi-option dialog choice; when it is empty the boolean
        response is used instead. Legal action values are approve_once,
        approve_always, elevate, allow_folder_session, and deny. Returns 404
        when the request_id is unknown or already handled.
      operationId: gitConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitConfirmRequest"
      responses:
        "200":
          description: The response was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitSuccessResponse"
        "400":
          description: Invalid JSON or a missing request_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The request_id is not found or was already handled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/deep-review:
    post:
      tags: [git]
      summary: Review the staged changes with reviewer subagents.
      description: >-
        Reviews the staged change with reviewer subagents (the same
        review_changes pipeline) and returns structured verdict and guidance
        for the review tab's fix picker. Requires staged changes. Takes no
        request body.
      operationId: gitDeepReview
      responses:
        "200":
          description: The review completed; the verdict and guidance for the fix picker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitDeepReviewResponse"
        "400":
          description: No staged changes were found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The review failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No AI agent is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/deep-review/fix:
    post:
      tags: [git]
      summary: Run the deep-review fix workflow and block until it completes.
      description: >-
        Runs the fix workflow for the given deep-review output and blocks
        until it completes, then returns the workflow's final result. This is
        the legacy synchronous form; the /api/git/deep-review/fix/start and
        /api/git/deep-review/fix/status pair is the preferred job-based form.
      operationId: gitDeepReviewFix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitDeepReviewFixRequest"
      responses:
        "200":
          description: The fix workflow completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitDeepReviewFixResponse"
        "400":
          description: Invalid JSON or a missing review_output.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The fix workflow could not be started, failed to run, or produced no result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/deep-review/fix/start:
    post:
      tags: [git]
      summary: Start an isolated deep-review fix job.
      description: >-
        Starts an isolated full-agent fix workflow job for the given
        deep-review output and returns its job_id and session_id so the
        client can poll /api/git/deep-review/fix/status.
      operationId: gitDeepReviewFixStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitDeepReviewFixRequest"
      responses:
        "200":
          description: The fix job was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitDeepReviewFixStartResponse"
        "400":
          description: Invalid JSON or a missing review_output.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The fix job could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/discard:
    post:
      tags: [git]
      summary: Discard changes to a file.
      description: >-
        Reverts a file's changes back to HEAD, regardless of whether they are
        staged, unstaged, both, or the file is untracked (untracked files are
        deleted). The path must name a file that is part of the git changes.
      operationId: gitDiscard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitFileOperationRequest"
      responses:
        "200":
          description: The changes were discarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitFileOperationResponse"
        "400":
          description: Invalid JSON, a missing or invalid path, or the file is not part of the git changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The changes could not be discarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/pull:
    post:
      tags: [git]
      summary: Pull the latest changes from the upstream branch.
      description: >-
        Runs git pull --ff-only in the active workspace. Takes no request
        body. The response echoes the git pull output.
      operationId: gitPull
      responses:
        "200":
          description: The pull completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitPullPushResponse"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The pull failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/pull-request:
    post:
      tags: [git]
      summary: Create a pull request.
      description: >-
        Creates a pull request via the gh CLI or the GitHub API. The title is
        required; body, base, and head are optional and fall back to the
        repository default branch and current branch. On success the response
        carries the PR url and number; on failure it carries success=false and
        an error string instead.
      operationId: gitPullRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitPullRequestCreate"
      responses:
        "200":
          description: The pull request was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitPullRequestResponse"
        "400":
          description: Invalid JSON or a missing PR title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Pull request creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitPullRequestResponse"
  /api/git/push:
    post:
      tags: [git]
      summary: Push the current branch to its upstream.
      description: >-
        Runs git push in the active workspace. Takes no request body. The
        response echoes the git push output.
      operationId: gitPush
      responses:
        "200":
          description: The push completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitPullPushResponse"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The push failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/revert:
    post:
      tags: [git]
      summary: Revert a commit.
      description: >-
        Runs git revert --no-edit for the given commit hash. The hash must be
        non-empty and must not start with a hyphen. The response echoes the
        reverted commit hash.
      operationId: gitRevert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitCommitRevertRequest"
      responses:
        "200":
          description: The commit was reverted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitCommitRevertResponse"
        "400":
          description: Invalid JSON, a missing commit hash, or an invalid commit hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The commit could not be reverted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/stage:
    post:
      tags: [git]
      summary: Stage a file.
      description: >-
        Stages the file at the given path with git add. The path must be
        non-empty and must name a file that is part of the git changes.
      operationId: gitStage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitFileOperationRequest"
      responses:
        "200":
          description: The file was staged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitFileOperationResponse"
        "400":
          description: Invalid JSON, a missing or invalid path, or the file is not part of the git changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The file could not be staged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/stage-all:
    post:
      tags: [git]
      summary: Stage all changes.
      description: >-
        Stages all changes with git add -A in the active workspace. Takes no
        request body.
      operationId: gitStageAll
      responses:
        "200":
          description: All changes were staged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitMessageResponse"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The changes could not be staged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/unstage:
    post:
      tags: [git]
      summary: Unstage a file.
      description: >-
        Unstages the file at the given path with git reset HEAD. The path must
        be non-empty and must name a file that is part of the git changes.
      operationId: gitUnstage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitFileOperationRequest"
      responses:
        "200":
          description: The file was unstaged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitFileOperationResponse"
        "400":
          description: Invalid JSON, a missing or invalid path, or the file is not part of the git changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The file could not be unstaged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/unstage-all:
    post:
      tags: [git]
      summary: Unstage all changes.
      description: >-
        Unstages all changes with git reset HEAD in the active workspace.
        Takes no request body.
      operationId: gitUnstageAll
      responses:
        "200":
          description: All changes were unstaged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitMessageResponse"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The changes could not be unstaged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/worktree/checkout:
    post:
      tags: [git]
      summary: Switch to an existing worktree.
      description: >-
        Switches the active workspace to the worktree at the given path. The
        path must resolve to a worktree that git already knows about. Chat
        sessions are preserved and the workspace is re-rooted to the target.
      operationId: gitWorktreeCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitWorktreePathRequest"
      responses:
        "200":
          description: Switched to the worktree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitWorktreeCheckoutResponse"
        "400":
          description: Invalid JSON, a missing or invalid path, or the worktree was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The worktree list could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/worktree/create:
    post:
      tags: [git]
      summary: Create a new worktree.
      description: >-
        Creates a new worktree at the given path on a new branch. When
        base_ref is provided the branch is created from that ref; otherwise it
        is created from the current HEAD. The path must stay within the
        workspace or sit beside it. Returns 409 when the branch already exists.
      operationId: gitWorktreeCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitWorktreeCreateRequest"
      responses:
        "200":
          description: The worktree was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitWorktreeCreateResponse"
        "400":
          description: Invalid JSON, a missing path or branch, an invalid path, or an invalid branch name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A branch with that name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The worktree could not be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/git/worktree/remove:
    post:
      tags: [git]
      summary: Remove an existing worktree.
      description: >-
        Removes the worktree at the given path. The path must not be the
        current workspace and must stay within the workspace or sit beside it.
      operationId: gitWorktreeRemove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitWorktreePathRequest"
      responses:
        "200":
          description: The worktree was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitWorktreeRemoveResponse"
        "400":
          description: Invalid JSON, a missing or invalid path, or the path is the current worktree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: The route only accepts POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The worktree could not be removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      # The standard error envelope every handler returns on failure: a
      # human-readable message plus a stable machine-readable code (the `code`
      # string passed to writeJSONErr). Family items reference this from their
      # error responses.
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable error code.
      required:
        - error
        - code
    QueryRequest:
      type: object
      description: The request body for /api/query.
      properties:
        query:
          type: string
          description: The query text. Required.
        chat_id:
          type: string
          description: Target chat session; falls back to the client's active chat.
        provider:
          type: string
          description: Per-query provider override.
        model:
          type: string
          description: Per-query model override.
        workspace_root:
          type: string
          description: Per-query workspace root override.
        system_prompt:
          type: string
          description: Per-query system-prompt override.
      required:
        - query
    QueryAcceptedResponse:
      type: object
      description: The 202 response from /api/query, which echoes the submitted query text.
      properties:
        accepted:
          type: boolean
        query:
          type: string
          description: Echo of the submitted query text.
        chat_id:
          type: string
        timestamp:
          type: integer
          format: int64
          description: Unix seconds when the query was accepted.
      required:
        - accepted
        - chat_id
        - timestamp
    QueryStopAlreadyCompleted:
      type: object
      description: The 200 response from /api/query/stop when nothing was running.
      properties:
        status:
          type: string
          enum: [ok]
        already_completed:
          type: boolean
        timestamp:
          type: integer
          format: int64
      required:
        - status
        - already_completed
        - timestamp
    QueryStopAccepted:
      type: object
      description: The 202 response from /api/query/stop when a query was interrupted.
      properties:
        accepted:
          type: boolean
        mode:
          type: string
          enum: [stop]
        chat_id:
          type: string
        cancelled_subagents:
          type: integer
          description: Number of running subagents that were cancelled.
        timestamp:
          type: integer
          format: int64
      required:
        - accepted
        - mode
        - chat_id
        - timestamp
    QueryStatusResponse:
      type: object
      description: The response from /api/query/status.
      properties:
        active:
          type: boolean
          description: Whether a query is currently active for the chat.
        chat_id:
          type: string
      required:
        - active
        - chat_id
    QuerySteerRequest:
      type: object
      description: The request body for /api/query/steer.
      properties:
        query:
          type: string
          description: The steer input; a leading "/" runs a safe slash command.
        chat_id:
          type: string
          description: Target chat session; falls back to the client's active chat.
      required:
        - query
    SteerAcceptedResponse:
      type: object
      description: The 202 response from /api/query/steer when input was injected.
      properties:
        accepted:
          type: boolean
        mode:
          type: string
          enum: [steer]
        query:
          type: string
          description: Echo of the steer input.
        target:
          type: string
          enum: [primary, subagent]
          description: Which agent the input was delivered to.
        subagent_id:
          type: string
          description: Present when the input was routed to a subagent.
        timestamp:
          type: integer
          format: int64
      required:
        - accepted
        - mode
        - query
        - target
        - timestamp
    SteerCommandResponse:
      type: object
      description: The 200 response from /api/query/steer when a safe command was executed.
      properties:
        accepted:
          type: boolean
          description: True when the command ran without an error.
        mode:
          type: string
          enum: [steer]
        command:
          type: string
          description: The executed command's name.
        target:
          type: string
          enum: [primary]
        output:
          type: string
          description: The command's captured output, when any.
        error:
          type: string
          description: The command's error, when it failed.
      required:
        - accepted
        - mode
        - command
        - target
    SteerRetractResponse:
      type: object
      description: The response from /api/query/steer/retract.
      properties:
        success:
          type: boolean
          description: False when there was nothing to retract.
        message:
          type: string
          description: The retracted text, or empty when nothing was pending.
      required:
        - success
        - message
    QueryRewindRequest:
      type: object
      description: The request body for /api/query/rewind.
      properties:
        to_turn:
          type: integer
          description: 0-based turn index to rewind to, before this turn. Required.
        revert_files:
          type: boolean
          description: Whether to revert file changes from the discarded turns. Defaults to true.
        chat_id:
          type: string
          description: Target chat session; falls back to the client's active chat.
      required:
        - to_turn
    QueryRewindResponse:
      type: object
      description: The response from /api/query/rewind.
      properties:
        turns_discarded:
          type: integer
        messages_removed:
          type: integer
        files_reverted:
          type: array
          items:
            type: string
          description: Files whose changes were reverted.
        files_skipped:
          type: array
          items:
            type: string
          description: Files that could not be reverted.
        checkpoints_dropped:
          type: integer
      required:
        - turns_discarded
        - messages_removed
        - files_reverted
        - files_skipped
        - checkpoints_dropped
    ChatSession:
      type: object
      description: >-
        The chat-session summary shared by the list, create, rename, pin, and
        unpin responses.
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
        message_count:
          type: integer
        current_session_id:
          type: string
        active_query:
          type: boolean
        is_default:
          type: boolean
          description: >-
            Whether this chat is the client's default chat. In the list
            response the list handler sets it true for the active chat; in the
            other (summary) responses it is true for the literal default chat.
            Use is_active to identify the currently active chat in the list
            response.
        is_pinned:
          type: boolean
        chat_id:
          type: string
          description: Alias of id; present in the list response.
        is_active:
          type: boolean
          description: Present in the list response; true for the active chat.
        provider:
          type: string
          description: Present when the chat overrides the provider.
        model:
          type: string
          description: Present when the chat overrides the model.
        worktree_path:
          type: string
          description: Present when the chat is bound to a worktree.
        current_query:
          type: string
          description: Present when a query is active.
        mode:
          type: string
          enum: [design]
          description: Present when the chat belongs to the design lane.
      required:
        - id
        - name
        - created_at
        - last_active_at
        - message_count
        - current_session_id
        - active_query
        - is_default
        - is_pinned
    ChatSessionWithMessages:
      type: object
      description: >-
        A chat session including its decoded messages and token and cost
        totals; returned by the switch, messages, and worktree endpoints.
      allOf:
        - $ref: "#/components/schemas/ChatSession"
        - type: object
          properties:
            run_events:
              type: array
              description: In-flight run events for a running chat, when present.
              items:
                type: object
            messages:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
                  reasoning_content:
                    type: string
                    description: Present when the message carried reasoning.
                  timestamp:
                    type: string
                    format: date-time
            total_tokens:
              type: integer
            total_cost:
              type: number
            session_id:
              type: string
    ChatSessionsListResponse:
      type: object
      description: The response from /api/chat-sessions.
      properties:
        message:
          type: string
        chat_sessions:
          type: array
          items:
