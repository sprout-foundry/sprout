<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844">
  <!-- mobile-session: phone session detail with declared states (SP-143 143.7 dogfood). Palette tokens: {color.dark.bg.primary} {color.dark.bg.success} {color.dark.bg.info} {color.dark.bg.error} {color.dark.text.primary} {color.dark.accent.primary} {color.dark.accent.success} {color.dark.accent.error} {typography.size.lg} {typography.size.base} -->
  <style>
    .bg { fill: #282c34; }
    .t1 { fill: #abb2bf; font: 16px sans-serif; }
    .t2 { fill: #abb2bf; font: 14px sans-serif; }
    .ac { fill: #61afef; font: 14px sans-serif; }
    .pane-ready { fill: rgba(152, 195, 121, 0.12); }
    .pane-loading { fill: rgba(97, 175, 239, 0.12); }
    .pane-error { fill: rgba(224, 108, 117, 0.12); }
    .ok { fill: #98c379; }
  </style>

  <rect x="0" y="0" width="390" height="844" class="bg"/>

  <!-- status bar inset (chrome.css owns the rendered bar) -->
  <rect x="0" y="0" width="390" height="47" class="bg"/>

  <text id="back" x="16" y="84" class="ac" data-nav="mobile-sessions">&#8592; Sessions</text>
  <text x="16" y="120" class="t1">Refactor the export pipeline</text>

  <!-- the three declared states; the runtime shows one at a time -->
  <rect id="state-ready" x="16" y="148" width="358" height="64" rx="8" class="pane-ready"/>
  <text x="32" y="184" class="ok">Ready — agent idle, last turn committed.</text>

  <rect id="state-loading" x="16" y="148" width="358" height="64" rx="8" class="pane-loading"/>
  <text x="32" y="184" class="ac">Loading — streaming the diff review.</text>

  <rect id="state-error" x="16" y="148" width="358" height="64" rx="8" class="pane-error"/>
  <text x="32" y="184" class="pane-error"/>
  <text x="32" y="184" class="t2">Error — tool failure. Retry the turn.</text>

  <!-- home indicator inset (chrome.css owns the rendered indicator) -->
  <rect x="0" y="820" width="390" height="24" class="bg"/>
</svg>
