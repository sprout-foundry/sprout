          type: integer
        column_start:
          description: The 1-based start column of the match.
          type: integer
        context_after:
          items:
            type: string
          type: array
        context_before:
          items:
            type: string
          type: array
        line:
          type: string
        line_number:
          type: integer
      required:
        - line_number
        - line
        - column_start
        - column_end
      type: object
    SearchResponse:
      description: The response from /api/search.
