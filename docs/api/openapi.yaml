      type: object
      description: A single commit entry in the git log.
      properties:
        hash:
          type: string
          description: The full commit hash.
        short_hash:
          type: string
          description: The abbreviated (seven-character) commit hash.
        author:
          type: string
          description: The author name.
        date:
          type: string
          description: The author date in strict ISO 8601.
        message:
          type: string
          description: The commit subject line.
        ref_names:
          type: string
          description: The branch or HEAD refs pointing at this commit; omitted when there are none.
      required:
        - hash
        - short_hash
        - author
        - date
        - message
